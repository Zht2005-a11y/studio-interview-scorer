<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>面试打分</title>
<style>
:root{
  /* 色板 */
  --bg:#f4f6fb;
  --card:#ffffff;
  --ink:#0f1729;
  --ink2:#5b6478;
  --ink3:#98a2b3;
  --line:#e9edf4;
  --line2:#dde3ee;
  --brand:#3d5bfd;
  --brand2:#6b5cff;
  --brand-soft:#eef1ff;
  --bad:#f04438;
  --bad-soft:#fef3f2;
  --warn:#f79009;
  --good:#12b76a;
  --good-soft:#eafaf1;
  /* 圆角 */
  --r-sm:11px;
  --r:18px;
  --r-lg:22px;
  /* 阴影 */
  --sh-sm:0 1px 2px rgba(16,24,40,.04);
  --sh:0 4px 16px rgba(16,24,40,.07);
  --sh-lg:0 12px 32px rgba(16,24,40,.13);
  /* 布局 */
  --pad-x:16px;
  --maxw:560px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;overscroll-behavior-y:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:"tnum";
}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font-family:inherit}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}

/* ---------- 顶栏 ---------- */
.appbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 12px) var(--pad-x) 11px;
  background:rgba(244,246,251,.84);backdrop-filter:saturate(180%) blur(18px);
  -webkit-backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid rgba(233,237,244,.85);
}
.appbar-l{flex:1;min-width:0}
.appbar-title{font-size:18.5px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar-sub{font-size:12px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{
  flex:none;width:36px;height:36px;border-radius:11px;background:var(--card);
  border:1px solid var(--line);box-shadow:var(--sh-sm);
  display:flex;align-items:center;justify-content:center;color:var(--ink2);transition:.15s;
}
.icon-btn:active{transform:scale(.92);background:#f7f9fc}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

main{padding:8px var(--pad-x) calc(96px + env(safe-area-inset-bottom))}

/* 宽屏（电脑/平板预览）时居中收窄，避免卡片被拉得很长 */
@media (min-width:640px){
  .appbar{max-width:var(--maxw);margin:0 auto;border-radius:0 0 var(--r-lg) var(--r-lg);border-bottom-color:var(--line)}
  main{max-width:var(--maxw);margin:0 auto}
}

/* ---------- 组列表 ---------- */
.gcard{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh-sm);padding:16px;margin-bottom:10px;transition:.16s;
}
.gcard:active{transform:scale(.985);box-shadow:var(--sh)}
.gbadge{
  flex:none;width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  background:var(--brand-soft);color:var(--brand);font-size:18px;font-weight:800;letter-spacing:-.5px;
}
.gmain{flex:1;min-width:0}
.gname{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.25px}
.gmeta{display:block;font-size:12.5px;color:var(--ink3);margin-top:3px;line-height:1.45}
.arrow{flex:none;color:#c9d0dd}
.arrow svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 主视觉卡 ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:var(--r-lg);padding:20px;margin-bottom:14px;
  background:linear-gradient(135deg,#4a6cf7 0%,#6b5cff 100%);
  box-shadow:0 12px 30px rgba(74,108,247,.26);color:#fff;
}
.hero::after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-66px;top:-84px;background:rgba(255,255,255,.12)}
.hero::before{content:"";position:absolute;width:120px;height:120px;border-radius:50%;left:-46px;bottom:-72px;background:rgba(255,255,255,.07)}
.hero-top{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hero-group{font-size:21px;font-weight:800;letter-spacing:-.4px}
.hero-iv{font-size:12.5px;opacity:.92;margin-top:5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero-switch{
  font-size:11.5px;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.22);
  color:#fff;font-weight:600;border:1px solid rgba(255,255,255,.28);transition:.16s;
}
.hero-switch:active{background:rgba(255,255,255,.34)}
.hero-num{text-align:right;line-height:1;flex:none}
.hero-num b{font-size:31px;font-weight:800;letter-spacing:-1.2px}
.hero-num span{font-size:14px;opacity:.78;margin-left:1px}
.hero-num em{display:block;font-size:11.5px;font-style:normal;opacity:.82;margin-top:6px;letter-spacing:.3px}
.hero-bar{position:relative;height:6px;border-radius:99px;background:rgba(255,255,255,.24);margin-top:16px;overflow:hidden}
.hero-bar i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .35s cubic-bezier(.22,.8,.28,1)}

/* ---------- 通用 ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh-sm);padding:16px;margin-bottom:14px;
}
.card-title{font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:12px;letter-spacing:.4px}
.hint{color:var(--ink2);font-size:13.5px;line-height:1.7}
.hint.warn{color:#b54708}
.empty{text-align:center;padding:34px 20px;color:var(--ink3);font-size:14px;line-height:1.9}

.chip-wrap{display:flex;flex-wrap:wrap;gap:9px}
.chip{
  padding:10px 18px;border-radius:999px;background:#f5f7fb;font-size:15px;font-weight:600;
  color:var(--ink2);border:1.5px solid transparent;transition:.16s;
}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 4px 12px rgba(61,91,253,.28)}
.chip:active{transform:scale(.96)}
.add-chip{background:var(--brand-soft);color:var(--brand);font-weight:600}

/* ---------- 面试者列表 ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.cand{
  position:relative;display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--sh-sm);padding:15px 16px;transition:.16s;overflow:hidden;
}
.cand::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.cand.done::before{background:var(--good)}
.cand.lock::before{background:var(--line2)}
.cand:active{transform:scale(.985);box-shadow:var(--sh)}
.cand .idx{
  flex:none;width:30px;height:30px;border-radius:10px;background:#f5f7fb;color:var(--ink3);
  font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.cand.done .idx{background:var(--good-soft);color:var(--good)}
.cand.lock{opacity:.6}
.cand.lock:active{transform:none;box-shadow:var(--sh-sm)}
.cand-main{flex:1;min-width:0}
.cand-name{display:block;font-size:16.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cand-cmt{display:block;font-size:12px;color:var(--ink2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cand-tag{flex:none;font-size:13px;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:5px 12px;border-radius:999px}
.cand-tag.empty{color:var(--ink3);background:#f5f7fb;font-weight:500}
.cand-tag.part{color:#b54708;background:#fff6e8;font-weight:600}
.cand.part::before{background:var(--warn)}

/* ---------- 打分页：轮次切换 + 本轮考察范围提示 ---------- */
.rd-switch{
  display:flex;gap:8px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px;
  -webkit-overflow-scrolling:touch;
}
.rd-switch::-webkit-scrollbar{display:none}
.rd-chip{
  flex:none;padding:7px 15px;border-radius:999px;background:var(--card);
  border:1.5px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink2);transition:.16s;
}
.rd-chip.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(61,91,253,.26)}
.rd-chip:active{transform:scale(.96)}
.scope-line{
  display:flex;align-items:flex-start;gap:8px;margin:-4px 0 12px;padding:10px 13px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
}
.scope-tag{
  flex:none;font-size:11.5px;font-weight:700;color:var(--brand);background:var(--brand-soft);
  padding:3px 9px;border-radius:999px;margin-top:1px;
}
.scope-txt{flex:1;min-width:0;font-size:12.5px;color:var(--ink2);line-height:1.6}
.scope-cfg{
  flex:none;font-size:12px;font-weight:700;color:var(--brand);background:var(--brand-soft);
  padding:5px 11px;border-radius:999px;white-space:nowrap;transition:.16s;
}
.scope-cfg:active{transform:scale(.95);background:#e2e7ff}
.scope-line.warn{background:#fffbf3;border-color:#f7e2b8}
.scope-tag.warn{color:#b54708;background:#fdf0d9}

/* ---------- 轮次：考察范围配置 ---------- */
.rd-row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:14px 15px;margin-bottom:10px;background:#f8fafd;
  border:1px solid var(--line);border-radius:16px;transition:.16s;
}
.rd-row:last-child{margin-bottom:0}
.rd-row:active{transform:scale(.99);background:#f1f4fa}
.rd-row.warn{background:#fffbf3;border-color:#f7e2b8}
.rd-row.warn .rd-meta{color:#b54708}
.rd-main{flex:1;min-width:0}
.rd-name{display:block;font-size:15.5px;font-weight:700;color:var(--ink)}
.rd-meta{display:block;font-size:12.5px;color:var(--ink3);margin-top:3px;line-height:1.5}
.rd-go{
  flex:none;display:inline-flex;align-items:center;gap:2px;
  font-size:12.5px;font-weight:700;color:var(--brand);background:var(--brand-soft);
  padding:7px 12px;border-radius:999px;white-space:nowrap;
}
.rd-go.warn{color:#b54708;background:#fdf0d9}
.pick-row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 14px;margin-bottom:9px;border-radius:14px;
  background:#f8fafd;border:1.5px solid var(--line);transition:.16s;
}
.pick-row:active{transform:scale(.99)}
.pick-row .pk-box{
  flex:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);
  background:#fff;color:transparent;font-size:13px;font-weight:800;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:.16s;
}
.pick-row.on{background:var(--brand-soft);border-color:var(--brand)}
.pick-row.on .pk-box{background:var(--brand);border-color:var(--brand);color:#fff}
.pick-main{flex:1;min-width:0}
.pick-name{display:block;font-size:15.5px;font-weight:700;color:var(--ink)}
.pick-meta{
  display:block;font-size:12px;color:var(--ink3);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ---------- 评语 ---------- */
.cm-box{
  width:100%;min-height:76px;padding:13px 14px;border-radius:13px;border:1.5px solid var(--line);
  background:#f8fafd;font-size:14.5px;color:var(--ink);outline:none;resize:vertical;
  font-family:inherit;line-height:1.65;transition:.16s;
}
.cm-box:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(61,91,253,.1)}
.cm-box::placeholder{color:var(--ink3)}
.cm-meta{font-size:12px;color:var(--ink3);margin-top:7px}
.rank-comment{
  margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid var(--line);
  font-size:12.5px;color:var(--ink2);line-height:1.65;
}
.rank-comment b{color:var(--ink);font-weight:600}

/* ---------- 排名 ---------- */
.rank-row{
  position:relative;display:flex;align-items:center;gap:13px;background:var(--card);
  border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-sm);
  padding:15px 16px;margin-bottom:10px;width:100%;text-align:left;transition:.16s;
}
.rank-row:active{transform:scale(.99);box-shadow:var(--sh)}
.medal{
  flex:none;width:33px;height:33px;border-radius:11px;background:#f5f7fb;color:var(--ink3);
  font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;
}
.medal.m1{background:linear-gradient(135deg,#ffd75e,#f7a928);color:#fff;box-shadow:0 4px 12px rgba(247,169,40,.34)}
.medal.m2{background:linear-gradient(135deg,#dfe4ec,#aeb8c8);color:#fff}
.medal.m3{background:linear-gradient(135deg,#f2b98f,#cd7a45);color:#fff}
.rank-main{flex:1;min-width:0}
.rank-name{font-size:16.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-sub{font-size:12px;color:var(--ink3);margin-top:3px}
.rank-score{flex:none;text-align:right}
.rank-score b{font-size:23px;font-weight:800;color:var(--brand);letter-spacing:-.7px}
.rank-score span{font-size:11px;color:var(--ink3);display:block;margin-top:1px}
.rank-detail{
  margin:-4px 0 12px;padding:13px 16px;background:#f8fafd;border:1px solid var(--line);
  border-radius:14px;font-size:13px;color:#475467;
}
.rank-detail .d-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.rank-detail .d-row+.d-row{border-top:1px dashed var(--line)}
.rank-detail .d-row b{color:var(--ink);flex:none;font-weight:700}

/* ---------- 底部导航 ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;
  background:rgba(255,255,255,.93);backdrop-filter:saturate(180%) blur(18px);
  -webkit-backdrop-filter:saturate(180%) blur(18px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav button{
  position:relative;flex:1 1 0;max-width:190px;
  padding:7px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:11px;font-weight:600;color:var(--ink3);transition:color .16s;
}
.nav button::before{
  content:"";position:absolute;top:5px;left:50%;margin-left:-21px;width:42px;height:26px;
  border-radius:99px;background:transparent;transition:background .18s;
}
.nav button.on{color:var(--brand)}
.nav button.on::before{background:var(--brand-soft)}
.nav button:active{transform:scale(.94)}
.nav svg{
  position:relative;width:22px;height:22px;stroke:currentColor;fill:none;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}

/* ---------- 弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.44);z-index:40;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);
  border-radius:var(--r-lg) var(--r-lg) 0 0;max-height:92vh;overflow-y:auto;
  padding:8px 18px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(101%);transition:transform .3s cubic-bezier(.22,.8,.28,1);
  box-shadow:0 -10px 44px rgba(16,24,40,.2);-webkit-overflow-scrolling:touch;
}
.sheet.show{transform:translateY(0)}
.sheet-grab{width:38px;height:4.5px;border-radius:99px;background:#e4e7ec;margin:6px auto 12px}
.sheet-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding-bottom:14px;border-bottom:1px solid var(--line);
}
.sheet-name{font-size:20px;font-weight:700;letter-spacing:-.4px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-sub{font-size:12.5px;color:var(--ink3);margin-top:3px;line-height:1.5}
.sheet-close{
  flex:none;font-size:13.5px;font-weight:600;color:var(--ink2);
  padding:8px 13px;border-radius:11px;background:#f5f7fb;border:1px solid var(--line);transition:.16s;
}
.sheet-close:active{transform:scale(.95);background:#eef1f6}

/* 三段式弹窗：头部 + 中间滚动 + 底部常驻操作栏（软键盘弹起也点得到保存） */
.sheet.stack{display:flex;flex-direction:column;overflow:hidden;padding-bottom:0}
.sheet.stack>*{flex:none}
.sheet.stack>.sheet-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:10px}
.sheet-foot{
  margin:0 -18px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  background:var(--card);border-top:1px solid var(--line);
  box-shadow:0 -6px 22px rgba(16,24,40,.06);
}
@media (min-width:640px){
  .sheet{max-width:var(--maxw);margin:0 auto;border-radius:var(--r-lg)}
}

/* ---------- 打分（核心控件） ---------- */
.grade-block{margin-top:20px}
.grade-block:first-of-type{margin-top:16px}
.grade-label{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:10px;letter-spacing:.2px}
.grade-row{display:grid;gap:9px;grid-template-columns:repeat(3,1fr)}
.grade-row[data-n="1"]{grid-template-columns:1fr}
.grade-row[data-n="2"]{grid-template-columns:1fr 1fr}
.grade-row[data-n="4"]{grid-template-columns:1fr 1fr}
.grade-row[data-n="5"],.grade-row[data-n="6"]{grid-template-columns:repeat(3,1fr)}
.grade{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  min-height:66px;padding:14px 6px;border-radius:15px;
  background:#f7f9fc;border:1.5px solid var(--line);
  font-size:15.5px;font-weight:700;color:var(--ink);transition:.16s;
}
.grade span{font-size:12px;font-weight:600;color:var(--ink3);letter-spacing:.2px}
.grade:active{transform:scale(.96)}
.grade.on{
  color:#fff;border-color:transparent;background:var(--g,var(--brand));
  box-shadow:0 8px 18px rgba(16,24,40,.16);
}
.grade.on span{color:rgba(255,255,255,.9)}

.total-line{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-size:13px;color:var(--ink2);
}
.total-line b{font-size:22px;font-weight:800;color:var(--brand);letter-spacing:-.6px}
.total-line.warn b{color:#b54708}
.btn-primary{
  width:100%;padding:16px;border-radius:15px;
  background:linear-gradient(135deg,#4a6cf7,#6b5cff);color:#fff;font-size:16.5px;font-weight:700;
  box-shadow:0 8px 20px rgba(74,108,247,.3);transition:.16s;
}
.btn-primary:disabled{background:#e4e7ec;box-shadow:none;color:#98a2b3}
.btn-primary:active{transform:scale(.985)}

/* ---------- 管理 / 添加 ---------- */
.m-sec{margin-top:20px}
.add-row{display:flex;gap:9px;margin-bottom:12px}
.add-row input{
  flex:1;min-width:0;padding:13px 15px;border-radius:13px;border:1.5px solid var(--line);
  background:#f8fafd;font-size:16px;color:var(--ink);outline:none;transition:.16s;
}
.add-row input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(61,91,253,.1)}
.add-row input::placeholder{color:var(--ink3)}
.add-row button{
  flex:none;padding:0 22px;border-radius:13px;
  background:linear-gradient(135deg,#4a6cf7,#6b5cff);color:#fff;
  font-size:15px;font-weight:700;box-shadow:0 6px 16px rgba(74,108,247,.26);transition:.16s;
}
.add-row button:active{transform:scale(.95)}
.tag{
  display:inline-flex;align-items:center;gap:7px;padding:8px 10px 8px 15px;border-radius:999px;
  background:#f5f7fb;border:1px solid var(--line);font-size:14.5px;font-weight:500;color:var(--ink2);
}
.tag i{
  width:20px;height:20px;border-radius:50%;background:#e4e7ec;color:var(--ink2);
  font-style:normal;font-size:13px;line-height:20px;text-align:center;font-weight:700;transition:.16s;
}
.tag i:active{background:var(--bad);color:#fff}

/* ---------- 打分项：列表卡片 ---------- */
.dim-card{
  display:flex;gap:12px;align-items:flex-start;padding:14px 15px;margin-bottom:10px;
  background:#f8fafd;border:1px solid var(--line);border-radius:16px;
}
.dim-card:last-child{margin-bottom:0}
.dim-main{flex:1;min-width:0}
.dim-name{font-size:16.5px;font-weight:700;color:var(--ink);letter-spacing:-.25px}
.dim-mode{
  display:inline-block;margin-left:7px;vertical-align:1px;
  font-size:11px;font-weight:700;color:var(--brand);background:var(--brand-soft);
  padding:2px 8px;border-radius:999px;letter-spacing:0;
}
.dim-meta{font-size:12.5px;color:var(--ink3);margin-top:3px}
.dim-lvs{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.dim-lv{
  display:inline-flex;align-items:baseline;gap:5px;padding:5px 11px;border-radius:999px;
  background:var(--brand-soft);font-size:13px;font-weight:600;color:var(--ink2);
}
.dim-lv b{font-size:13px;font-weight:800;color:var(--brand)}
.dim-acts{flex:none;display:flex;gap:8px}
.dim-acts button{
  width:40px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--brand);
  font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:.16s;
}
.dim-acts button.a-del{background:var(--bad-soft);color:var(--bad);font-size:20px}
.dim-acts button:active{transform:scale(.92)}
.btn-new{
  width:100%;margin-top:14px;padding:16px;border-radius:15px;display:flex;align-items:center;
  justify-content:center;gap:7px;background:linear-gradient(135deg,#4a6cf7,#6b5cff);color:#fff;
  font-size:16.5px;font-weight:700;box-shadow:0 8px 20px rgba(74,108,247,.3);transition:.16s;
}
.btn-new:active{transform:scale(.985)}
.btn-new i{font-style:normal;font-size:20px;font-weight:600;line-height:1;margin-top:-1px}

/* ---------- 打分项类型切换（选等级 / 自由填分） ---------- */
.seg{display:flex;gap:4px;padding:4px;background:#f5f7fb;border:1px solid var(--line);border-radius:14px}
.seg button{
  flex:1;padding:12px 8px;border-radius:11px;font-size:14.5px;font-weight:600;
  color:var(--ink2);transition:.16s;
}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 2px 8px rgba(16,24,40,.08)}
.seg button:active{transform:scale(.97)}
.free-preview{
  display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:14px;
  background:#f8fafd;border:1.5px dashed var(--line2);
}
.free-preview b{font-size:24px;font-weight:800;color:var(--brand);letter-spacing:-.6px}
.free-preview span{font-size:13px;color:var(--ink3)}
.free-preview em{font-style:normal;font-size:12.5px;color:var(--ink2);margin-left:auto}

/* ---------- 打分面板：自由填分控件 ---------- */
.grade-label em{
  float:right;font-style:normal;font-weight:500;font-size:11.5px;color:var(--ink3);
}
.free-row{display:flex;align-items:center;gap:10px}
.free-input{
  flex:1;min-width:0;padding:16px 18px;border-radius:15px;
  border:1.5px solid var(--line);background:#f8fafd;
  font-size:23px;font-weight:800;color:var(--ink);letter-spacing:-.6px;
  outline:none;text-align:center;transition:.16s;
}
.free-input::placeholder{font-size:15px;font-weight:500;letter-spacing:0;color:var(--ink3)}
.free-input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(61,91,253,.1)}
.free-input.bad{border-color:var(--bad);background:#fff8f7}
.free-unit{flex:none;font-size:15px;font-weight:700;color:var(--ink3)}
.free-hint{font-size:12px;color:var(--ink3);margin-top:8px;text-align:center}
.free-hint.bad{color:#b54708;font-weight:600}

/* ---------- 打分项表单弹窗（新建 / 编辑等级） ---------- */
.sheet-foot.row{display:flex;gap:10px}
.sheet-foot.row button{flex:1;padding:15px;border-radius:14px;font-size:16px;font-weight:700;transition:.16s}
.sheet-foot .b-cancel{flex:0 0 33%;background:#f5f7fb;color:var(--ink2);border:1px solid var(--line)}
.sheet-foot .b-save{background:linear-gradient(135deg,#4a6cf7,#6b5cff);color:#fff;box-shadow:0 8px 20px rgba(74,108,247,.3)}
.sheet-foot .b-save:disabled{background:#e4e7ec;color:#98a2b3;box-shadow:none}
.sheet-foot button:active{transform:scale(.98)}
.sheet-foot .btn-primary{margin-top:10px}
.sheet-foot .b-danger{background:linear-gradient(135deg,#f04438,#f97066);box-shadow:0 8px 20px rgba(240,68,56,.26)}

/* ---------- 应用内二次确认（替代原生 confirm） ---------- */
.confirm-body{padding:18px 2px 6px}
.confirm-target{
  font-size:17px;font-weight:700;color:var(--ink);line-height:1.5;margin-bottom:10px;
  word-break:break-all;
}
.confirm-lines{font-size:13.5px;color:var(--ink2);line-height:1.8}
.confirm-lines div{position:relative;padding-left:15px}
.confirm-lines div::before{
  content:"";position:absolute;left:3px;top:11px;width:5px;height:5px;
  border-radius:50%;background:var(--ink3);
}

.f-label{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  font-size:13px;font-weight:700;color:var(--ink2);margin:18px 0 9px;letter-spacing:.2px;
}
.f-label em{font-style:normal;font-size:11.5px;font-weight:500;color:var(--ink3)}
.f-input{
  width:100%;padding:13px 15px;border-radius:13px;border:1.5px solid var(--line);
  background:#f8fafd;font-size:16px;color:var(--ink);outline:none;transition:.16s;
}
.f-input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(61,91,253,.1)}
.f-input::placeholder{color:var(--ink3)}
.f-input.bad{border-color:var(--bad);background:#fff8f7}
.form-msg{
  margin-top:14px;padding:11px 14px;border-radius:12px;background:#f5f7fb;
  font-size:13px;color:var(--ink2);line-height:1.6;
}
.form-msg.ok{background:var(--good-soft);color:#05603a}
.form-msg.err{background:var(--bad-soft);color:#b42318}

.lv-row{display:flex;gap:8px;margin-bottom:9px;align-items:center}
.lv-row input{
  flex:1;min-width:0;padding:11px 12px;border-radius:11px;border:1.5px solid var(--line);
  background:#f8fafd;font-size:15px;color:var(--ink);outline:none;transition:.16s;
}
.lv-row input:focus{border-color:var(--brand);background:#fff}
.lv-row input::placeholder{color:var(--ink3)}
.lv-row input.lv-score{flex:0 0 74px;text-align:center;font-weight:700}
.lv-row.bad input{border-color:var(--bad);background:#fff8f7}
.lv-row .lv-del{
  flex:none;width:34px;height:34px;border-radius:10px;background:#f5f7fb;color:var(--ink3);
  font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:.16s;
}
.lv-row .lv-del:active{background:var(--bad-soft);color:var(--bad)}
.lv-head{display:flex;gap:8px;padding:0 2px 7px;font-size:11.5px;font-weight:600;color:var(--ink3)}
.lv-head .h-l{flex:1}
.lv-head .h-s{flex:0 0 74px;text-align:center}
.lv-head .h-d{flex:0 0 34px}
.lv-add{
  width:100%;margin-top:2px;padding:13px;border-radius:13px;
  background:#f5f7fb;border:1px dashed var(--line2);
  font-size:14.5px;font-weight:600;color:var(--ink2);transition:.16s;
}
.lv-add:active{transform:scale(.985);background:#eef1f6}
.lv-preview{display:flex;flex-wrap:wrap;gap:8px}
.lv-pv{
  display:flex;flex-direction:column;align-items:center;gap:2px;min-width:70px;
  padding:10px 14px;border-radius:13px;background:#f8fafd;border:1.5px solid var(--line);
}
.lv-pv em{font-style:normal;font-size:14px;font-weight:600;color:var(--ink)}
.lv-pv b{font-size:11.5px;font-weight:700;color:var(--brand)}
.lv-pv.none em{color:var(--ink3);font-weight:500}

/* ---------- 首页「面试者名单」入口 / 批量导入 ---------- */
.gbadge.add{background:linear-gradient(135deg,#12b76a,#3ecf8e);box-shadow:0 6px 16px rgba(18,183,106,.26)}
.gbadge.add svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.add-row input.c-cls{flex:0 0 32%}
.batch-box textarea{
  width:100%;min-height:92px;padding:12px 14px;border-radius:13px;border:1.5px solid var(--line);
  background:#f8fafd;font-size:14.5px;color:var(--ink);outline:none;resize:vertical;
  font-family:inherit;line-height:1.8;transition:.16s;
}
.batch-box textarea:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(61,91,253,.1)}
.batch-box textarea::placeholder{color:var(--ink3)}
.lv-text{
  width:100%;min-height:70px;margin-top:4px;padding:12px 14px;border-radius:13px;border:1.5px solid var(--line);
  background:#f8fafd;font-size:14.5px;color:var(--ink);outline:none;resize:vertical;
  font-family:inherit;line-height:1.8;transition:.16s;
}
.lv-text:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(61,91,253,.1)}
.btn-batch{
  width:100%;margin-top:10px;padding:13px;border-radius:13px;
  background:var(--brand-soft);color:var(--brand);
  font-size:15px;font-weight:700;transition:.16s;
}
.btn-batch:active{transform:scale(.98);background:#e2e7ff}
.c-cls{font-style:normal;font-size:12.5px;color:var(--ink3);font-weight:500;margin-left:8px}

.toast{
  position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:rgba(15,23,41,.94);color:#fff;font-size:14px;padding:12px 22px;border-radius:999px;
  z-index:90;max-width:82vw;text-align:center;box-shadow:var(--sh-lg);
  animation:toastIn .22s cubic-bezier(.22,.8,.28,1);
}
@keyframes toastIn{
  from{opacity:0;transform:translateX(-50%) translateY(8px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}
}
[hidden]{display:none !important}
</style>

<body>

<header class="appbar">
  <button class="icon-btn" id="backBtn" hidden>
    <svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>
  </button>
  <div class="appbar-l">
    <div class="appbar-title" id="topTitle">面试打分</div>
    <div class="appbar-sub" id="topSub"></div>
  </div>

<main id="main"></main>

<nav class="nav">
  <button id="navScore" class="on">
    <svg viewBox="0 0 24 24"><path d="M9 4h6v2H9z"/><path d="M15 5h2a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h2"/><path d="m9 13 2 2 4-4"/></svg>
    打分
  </button>
  <button id="navRank">
    <svg viewBox="0 0 24 24"><rect x="3" y="12" width="4" height="8" rx="1"/><rect x="10" y="7" width="4" height="13" rx="1"/><rect x="17" y="3" width="4" height="17" rx="1"/></svg>
    排名
  </button>
  <button id="navManage">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    管理
  </button>

<div class="mask" id="mask" hidden></div>
<section class="sheet" id="sheet" hidden></section>
<section class="sheet" id="asheet" hidden></section>
<section class="sheet" id="dsheet" hidden></section>
<section class="sheet" id="csheet" hidden></section>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  var CFG = null;
  var ME = null;          // { interviewer }（全局面试官名单里的名字，任何组通用）
  var MY = {};            // 我已打的分（当前轮次内）：candidateId -> { e, w }
  var MYG = null;         // MY 是哪个「组+轮次」组合拉的（换组/换轮次要重新拉）
  var LOCK = {};          // 当前轮次内面试者已被哪个组评分：candidateId -> 组id（该轮被别的组评过本组就不能再评）
  var CURGROUP = null;    // 当前进入的组
  var CURROUND = null;    // 当前轮次（打分/排名共用；轮次只区分分数归属，组与面试官配置不变）
  var VIEW = 'score';     // score | rank | manage
  var MANAGE_SEC = null;  // 管理页当前子页：null(入口) | iv | dim | gp | rd
  var RANK_ROUND = null;  // 排名页当前轮次：null = 全部轮次总排名；轮次id = 该轮排名
  var RANK = null;       // 统一排名的行
  var LS_KEY = 'interview_me_v2';
  var API_BASE = location.pathname.replace(/[^\/]*$/, '');

  function $(s) { return document.querySelector(s); }
  function el(t, c, h) { var e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function vib(ms) { try { if (navigator.vibrate) navigator.vibrate(ms || 12); } catch (e) {} }
  function toast(m) {
    var t = $('#toast'); t.textContent = m; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 1900);
  }
  function api(p, o) {
    return fetch(API_BASE + p.replace(/^\//, ''), o).then(function (r) {
      return r.json().catch(function () { return null; }).then(function (j) {
        if (!r.ok) throw new Error((j && j.error) || ('请求失败 ' + r.status));
        return j;
      });
    });
  }
  function post(p, body) {
    return api(p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  }
  function groupById(id) { for (var i = 0; i < CFG.groups.length; i++) if (CFG.groups[i].id === id) return CFG.groups[i]; return null; }
  function roundById(id) { if (!CFG.rounds) return null; for (var i = 0; i < CFG.rounds.length; i++) if (CFG.rounds[i].id === id) return CFG.rounds[i]; return null; }
  function firstRound() { return CFG.rounds && CFG.rounds.length ? CFG.rounds[0] : null; }
  function curRound() { return roundById(CURROUND) || firstRound(); }
  function dimById(id) {
    if (!CFG.dimensions) return null;
    for (var i = 0; i < CFG.dimensions.length; i++) if (CFG.dimensions[i].id === id) return CFG.dimensions[i];
    return null;
  }
  /* 打分项两种类型：
     - 选等级型（默认）：{ id, name, levels:[{key,label,score}] } —— 选一个等级，分值固定
     - 自由填分型：      { id, name, mode:'free', max } —— 面试官自己填 0~max */
  function dimIsFree(dm) { return !!dm && dm.mode === 'free'; }
  function dimScore(id, val) {
    var dm = dimById(id);
    if (!dm) return 0;
    if (dimIsFree(dm)) { var n = Number(val); return isFinite(n) ? n : 0; }
    for (var i = 0; i < dm.levels.length; i++) if (dm.levels[i].key === val) return dm.levels[i].score;
    return 0;
  }
  /* 这一项是否已作答（自由填分型 0 分也算作答，不能当成"没填"） */
  function dimAnswered(dm, val) {
    if (val === null || val === undefined || val === '') return false;
    if (dimIsFree(dm)) {
      var n = Number(val);
      return isFinite(n) && n >= 0 && n <= (dm.max || 100);
    }
    return !!val;
  }
  function dimTotal(dims) {
    var t = 0;
    Object.keys(dims).forEach(function (k) { t += dimScore(k, dims[k]); });
    return t;
  }

  /* ================= 轮次的考察范围 =================
     rounds[].dims = 打分项 id 白名单，**显式列出、不做任何隐式包含**。
     空数组 = 这一轮还没配置（打不了分，界面上会提示去配置）。
     新建打分项不会自动进入任何轮次，必须到「管理 → 轮次」里手动勾选。 */
  function roundDims(roundId) {
    var all = CFG.dimensions || [];
    var rd = roundById(roundId);
    if (!rd || !Array.isArray(rd.dims)) return all;   // 兜底：轮次已被删等
    return all.filter(function (d) { return rd.dims.indexOf(d.id) >= 0; });
  }
  function curDims() {
    var rd = curRound();
    return roundDims(rd ? rd.id : null);
  }
  /* 某份打分记录在「某一轮」口径下的总分（本轮不考察的项不计入） */
  function roundTotal(dims, roundId) {
    var t = 0;
    roundDims(roundId).forEach(function (d) {
      if (dimAnswered(d, dims ? dims[d.id] : null)) t += dimScore(d.id, dims[d.id]);
    });
    return t;
  }
  /* 本轮是否已打完整（本轮考察的每一项都作答了） */
  function isDone(cid) {
    var s = MY[cid];
    if (!s) return false;
    var ds = curDims();
    return ds.length > 0 && ds.every(function (d) { return dimAnswered(d, s[d.id]); });
  }
  /* 本轮还差几项没作答 */
  function dimsMissing(dims) {
    var n = 0;
    curDims().forEach(function (d) { if (!dimAnswered(d, dims ? dims[d.id] : null)) n++; });
    return n;
  }
  function dimsLabel(roundId) {
    var ds = roundDims(roundId);
    if (!ds.length) return '没有可考察的打分项';
    return ds.map(function (d) { return d.name; }).join('、');
  }
  function dimsMax(roundId) {
    var m = 0;
    roundDims(roundId).forEach(function (d) {
      if (dimIsFree(d)) { m += (d.max || 100); return; }
      var mx = 0;
      d.levels.forEach(function (lv) { if (lv.score > mx) mx = lv.score; });
      m += mx;
    });
    return m;
  }
  /* 一项的简要描述（用于轮次勾选列表等） */
  function dimBrief(d) {
    if (dimIsFree(d)) return '自由填分 0~' + (d.max || 100);
    return d.levels.map(function (lv) { return lv.label + ' ' + lv.score; }).join(' / ');
  }
  /* 某个打分项被哪些轮次考察（完全按各轮的显式列表算） */
  function dimUsage(dimId) {
    var rounds = CFG.rounds || [];
    if (!rounds.length) return '暂无轮次';
    var used = rounds.filter(function (r) {
      return Array.isArray(r.dims) && r.dims.indexOf(dimId) >= 0;
    });
    if (!used.length) return '还没有任何轮次考察它';
    if (used.length === rounds.length) return '全部轮次都考察';
    return '用于 ' + used.map(function (r) { return r.name; }).join('、');
  }
  /* 各轮的考察范围是否不一致（不一致时跨轮总排名不可比） */
  function roundsScopeDiffer() {
    var rounds = CFG.rounds || [];
    if (rounds.length < 2) return false;
    var sig = function (id) { return roundDims(id).map(function (d) { return d.id; }).join(','); };
    var first = sig(rounds[0].id);
    return rounds.some(function (r) { return sig(r.id) !== first; });
  }
  /* 该轮是否还没配置考察的打分项 */
  function roundUnconfigured(id) {
    return roundDims(id).length === 0;
  }
  function tsStr(ts) {
    var d = new Date(ts);
    function p(x) { return ('0' + x).slice(-2); }
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function saveME() { try { localStorage.setItem(LS_KEY, JSON.stringify(ME)); } catch (e) {} }
  function meOK() { return !!(ME && CFG.interviewers.indexOf(ME.interviewer) >= 0); }

  /* ================= 启动 ================= */
  function boot() {
    api('/api/config').then(function (cfg) {
      CFG = cfg;
      CURROUND = firstRound() ? firstRound().id : null;
      var saved = null;
      try { saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) {}
      var q = new URLSearchParams(location.search);
      var gid = q.get('g') || (saved && saved.groupId) || '';
      var nm = q.get('n') || (saved && saved.interviewer) || '';
      var g = groupById(gid);
      if (nm && CFG.interviewers.indexOf(nm) >= 0) {
        ME = { interviewer: nm };
        saveME();
        CURGROUP = g ? gid : null;
        if (CURGROUP) loadMine().then(render, render); else render();
      } else render();
    }).catch(function (e) {
      $('#main').innerHTML = '<div class="card hint warn">加载失败：' + esc(e.message) + '<br>请确认服务已启动。</div>';
    });
  }

  function loadMine() {
    if (!ME || !CURGROUP) { MY = {}; LOCK = {}; return Promise.resolve(); }
    var rr = curRound() ? curRound().id : '';
    return Promise.all([
      api('/api/mine?g=' + encodeURIComponent(CURGROUP) + '&i=' + encodeURIComponent(ME.interviewer) + '&r=' + encodeURIComponent(rr)),
      api('/api/scored?r=' + encodeURIComponent(rr))
    ]).then(function (r) {
      MY = {};
      (r[0].list || []).forEach(function (s) { MY[s.c] = s.dims || {}; });
      LOCK = r[1].of || {};
    });
  }

  /* 切换轮次：组、面试官名单、面试者名单都不变，只切换分数归属的轮次 */
  function switchRound(id) {
    if (!id || id === CURROUND || !roundById(id)) return;
    vib();
    CURROUND = id;
    MY = {}; MYG = null;
    if (VIEW === 'rank') { renderRank(); return; }
    if (CURGROUP) {
      var g = groupById(CURGROUP);
      if (g) { loadMine().then(function () { renderCandidates(g); }, function () { renderCandidates(g); }); }
      else render();
    } else render();
  }

  function render() {
    if (!CFG) return;   // 配置还没加载完就点了底部导航，先忽略
    $('#navScore').className = VIEW === 'score' ? 'on' : '';
    $('#navRank').className = VIEW === 'rank' ? 'on' : '';
    $('#navManage').className = VIEW === 'manage' ? 'on' : '';
    if (VIEW === 'rank') return renderRank();
    if (VIEW === 'manage') return renderManage();
    if (!CURGROUP) return renderGroups();
    return renderGroup();
  }

  /* ================= 组列表（首页） ================= */
  function renderGroups() {
    var main = $('#main'); main.innerHTML = '';
    $('#backBtn').hidden = true;
    $('#topTitle').textContent = CFG.title || '面试打分';
    $('#topSub').textContent = '先导入面试者名单，再进入小组打分';

    var entry = el('button', 'gcard');
    entry.innerHTML =
      '<span class="gbadge add"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg></span>' +
      '<span class="gmain"><span class="gname">面试者名单</span>' +
      '<span class="gmeta">共 ' + CFG.candidates.length + ' 人 · 添加 / 批量导入</span></span>' +
      '<span class="arrow"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></span>';
    entry.onclick = function () { vib(); openCands(); };
    main.appendChild(entry);

    var list = el('div', 'list');
    CFG.groups.forEach(function (g, i) {
      var gIv = Array.isArray(g.interviewers) ? g.interviewers : [];
      var card = el('button', 'gcard');
      card.innerHTML =
        '<span class="gbadge">' + (i + 1) + '</span>' +
        '<span class="gmain"><span class="gname">' + esc(g.name) + '</span>' +
        '<span class="gmeta">进入打分 · ' + (gIv.length ? gIv.length + ' 位面试官' : '未配置面试官') + ' · ' + ((CFG.rounds || []).length || 1) + ' 轮</span></span>' +
        '<span class="arrow"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></span>';
      card.onclick = function () { vib(); CURGROUP = g.id; render(); };
      list.appendChild(card);
    });
    main.appendChild(list);

    // 页面底部：轮次切换（各轮共用同一套小组与面试官，分数按轮隔离统计）
    var rdList = CFG.rounds || [];
    if (rdList.length > 1) {
      var rc = el('div', 'card');
      rc.appendChild(el('div', 'card-title', '轮次切换'));
      var rw = el('div', 'chip-wrap');
      rdList.forEach(function (x) {
        var b = el('button', 'chip' + (CURROUND === x.id ? ' on' : ''), esc(x.name));
        b.onclick = function () { switchRound(x.id); };
        rw.appendChild(b);
      });
      rc.appendChild(rw);
      rc.appendChild(el('div', 'hint', '<span style="font-size:12.5px;color:#98a2b3">各轮共用同一套小组与面试官，分数按轮单独统计、互不影响</span>'));
      main.appendChild(rc);
    }
  }

  /* ================= 组内 ================= */
  function renderGroup() {
    var g = groupById(CURGROUP);
    if (!g) { CURGROUP = null; return renderGroups(); }

    $('#backBtn').hidden = false;
    $('#topTitle').textContent = g.name;

    if (!meOK()) return renderPickIdentity(g);
    var gIv = Array.isArray(g.interviewers) ? g.interviewers : [];
    if (gIv.length && gIv.indexOf(ME.interviewer) < 0) return renderPickIdentity(g);
    if (MYG !== g.id + '|' + CURROUND) {
      // 换到另一个组/另一轮，重新拉当前「组+轮次」里我打的分
      MYG = g.id + '|' + CURROUND;
      return loadMine().then(function () { renderCandidates(g); },
                              function () { renderCandidates(g); });
    }
    renderCandidates(g);
  }

  /* --- 选一次自己是谁（只列出本组配置的面试官） --- */
  function renderPickIdentity(g) {
    var gIv = Array.isArray(g.interviewers) ? g.interviewers : [];
    $('#topSub').textContent = g.name + ' · 请选择你是哪位面试官';
    var main = $('#main'); main.innerHTML = '';

    if (!gIv.length) {
      main.appendChild(el('div', 'card hint warn',
        '「' + esc(g.name) + '」还没有配置面试官。<br>点底部「管理 → 小组」，进本组把面试官添加进来，再回来打分。'));
      return;
    }

    var card = el('div', 'card');
    card.appendChild(el('div', 'card-title', '你是哪位面试官？（' + esc(g.name) + '）'));
    var wrap = el('div', 'chip-wrap');
    gIv.forEach(function (n) {
      var b = el('button', 'chip', esc(n));
      b.onclick = function () {
        vib();
        ME = { interviewer: n };
        saveME();
        MYG = g.id + '|' + CURROUND;
        loadMine().then(render, function (e) { toast(e.message); render(); });
      };
      wrap.appendChild(b);
    });
    card.appendChild(wrap);
    card.appendChild(el('div', 'hint', '<span style="font-size:12.5px;color:#98a2b3">只需选一次，之后这台手机会自动记住；换到没配置你的小组时会重新选择。</span>'));
    main.appendChild(card);
  }

  /* --- 面试者列表（所有组共用一份名单；当前轮次内已被其他组评分的锁定） --- */
  function renderCandidates(g) {
    var rd = curRound();
    $('#topSub').textContent = g.name + ' · ' + (rd ? rd.name : '') + ' · 面试官 ' + ME.interviewer;
    var main = $('#main'); main.innerHTML = '';

    var lockedOf = function (c) {
      return LOCK[c.id] && LOCK[c.id] !== g.id ? LOCK[c.id] : null;
    };
    var cands = CFG.candidates;
    var usable = cands.filter(function (c) { return !lockedOf(c); });
    var total = usable.length;
    var done = 0;
    usable.forEach(function (c) { if (isDone(c.id)) done++; });

    var hero = el('div', 'hero');
    hero.innerHTML =
      '<div class="hero-top">' +
        '<div><div class="hero-group">' + esc(g.name) + '</div>' +
        '<div class="hero-iv">面试官 ' + esc(ME.interviewer) +
        '<button class="hero-switch" id="switchIv">切换</button></div></div>' +
        '<div class="hero-num"><b>' + done + '</b><span>/' + total + '</span><em>已打分</em></div>' +
      '</div>' +
      '<div class="hero-bar"><i style="width:' + (total ? done / total * 100 : 0) + '%"></i></div>';
    main.appendChild(hero);

    /* 各轮考察范围不同，打分页直接给个轮次切换条 */
    var rdList = CFG.rounds || [];
    if (rdList.length > 1) {
      var sw = el('div', 'rd-switch');
      rdList.forEach(function (x) {
        var b = el('button', 'rd-chip' + (rd && rd.id === x.id ? ' on' : ''), esc(x.name));
        b.onclick = function () { switchRound(x.id); };
        sw.appendChild(b);
      });
      main.appendChild(sw);
    }

    /* 本轮考察的打分项（完全由用户在「管理 → 轮次」里显式勾选） */
    var cds = curDims();
    var noScope = !cds.length;
    var scopeLine = el('div', 'scope-line' + (noScope ? ' warn' : ''));
    scopeLine.innerHTML = '<span class="scope-tag' + (noScope ? ' warn' : '') + '">' +
        (rd ? esc(rd.name) : '本轮') + (noScope ? '未配置' : '考察') + '</span>' +
      '<span class="scope-txt">' +
        (noScope ? '这一轮还没勾选考察的打分项，暂时打不了分' : esc(cds.map(function (d) { return d.name; }).join(' · '))) +
      '</span>' +
      '<button class="scope-cfg" id="scopeCfg">' + (noScope ? '去配置' : '改范围') + '</button>';
    main.appendChild(scopeLine);
    $('#scopeCfg').onclick = function () {
      vib();
      if (!rd) return;
      VIEW = 'manage'; MANAGE_SEC = 'rd';
      render();
      openRoundDims(rd.id);
    };

    if (!cands.length) {
      main.appendChild(el('div', 'card empty',
        '还没有面试者名单<br><span style="font-size:13px">回到首页，点「面试者名单」添加或批量导入</span>'));
    } else if (!usable.length) {
      main.appendChild(el('div', 'card empty',
        '名单里的面试者都已由其他组评分<br><span style="font-size:13px">可去「排名」页查看各组结果</span>'));
    } else {
      var list = el('div', 'list');
      cands.forEach(function (c, i) {
        var s = MY[c.id];
        var dn = isDone(c.id);
        var partial = !dn && s && Object.keys(s).length;      // 本轮只填了一部分
        var t = dn ? roundTotal(s, rd ? rd.id : null) : null;
        var lk = lockedOf(c);
        var lkName = lk ? (groupById(lk) || {}).name || '其他组' : '';
        var row = el('button', 'cand' + (lk ? ' lock' : (dn ? ' done' : (partial ? ' part' : ''))));
        var cm = c.comment;
        row.innerHTML = '<span class="idx">' + (i + 1) + '</span>' +
          '<span class="cand-main"><span class="cand-name">' + esc(c.name) +
          (c.cls ? '<em class="c-cls">' + esc(c.cls) + '</em>' : '') + '</span>' +
          (cm ? '<span class="cand-cmt">评语：' + esc(cm.text.length > 14 ? cm.text.slice(0, 14) + '…' : cm.text) + ' · ' + esc(cm.by) + '</span>' : '') +
          '</span>' +
          (lk ? '<span class="cand-tag empty">' + esc(lkName) + '已评</span>'
             : dn ? '<span class="cand-tag">' + t + ' 分</span>'
                : partial ? '<span class="cand-tag part">还差 ' + dimsMissing(s) + ' 项</span>'
                  : '<span class="cand-tag empty">未打分</span>');
        row.onclick = function () {
          if (lk) { toast('「' + c.name + '」已由' + lkName + '评分，本组不能再评'); return; }
          openSheet(c);
        };
        list.appendChild(row);
      });
      main.appendChild(list);
    }

    $('#switchIv').onclick = function () {
      ME = null; MY = {}; MYG = null;
      try { localStorage.removeItem(LS_KEY); } catch (e) {}
      render();
    };
  }

  /* ================= 打分面板 ================= */
  /* 等级按钮配色：低分偏暖（红）→ 高分偏冷（绿），按等级个数自适应取色。
     旧版只有 data-i 0/1/2 三档背景，打分项超过 3 个等级时选中态会没有背景色（白字白底）。 */
  var GRADE_RAMP = ['#e5484d', '#e8661d', '#c98a04', '#65a30d', '#16a34a', '#0f8a5f'];
  function gradeColors(n) {
    if (n <= 1) return [GRADE_RAMP[4]];
    var out = [];
    for (var i = 0; i < n; i++) out.push(GRADE_RAMP[Math.round(i * (GRADE_RAMP.length - 1) / (n - 1))]);
    return out;
  }

  function gradeBlock(title, dim, levels, cur) {
    var cols = gradeColors(levels.length);
    var h = '<div class="grade-block"><div class="grade-label">' + esc(title) + '</div>' +
            '<div class="grade-row" data-n="' + levels.length + '">';
    levels.forEach(function (lv, i) {
      h += '<button class="grade' + (cur === lv.key ? ' on' : '') + '" data-i="' + i +
        '" data-dim="' + dim + '" data-key="' + esc(lv.key) + '" style="--g:' + cols[i] + '">' +
        esc(lv.label) + '<span>' + lv.score + '</span></button>';
    });
    return h + '</div></div>';
  }

  /* 自由填分型：一个数字输入框，面试官自己填 0~max */
  function freeBlock(dim, val) {
    var v = (val === null || val === undefined) ? '' : String(val);
    return '<div class="grade-block">' +
      '<div class="grade-label">' + esc(dim.name) + '<em>0 ~ ' + dim.max + ' 分</em></div>' +
      '<div class="free-row">' +
        '<input class="free-input" id="free_' + esc(dim.id) + '" data-dim="' + esc(dim.id) + '"' +
        ' inputmode="decimal" maxlength="6" placeholder="填分数" value="' + esc(v) + '">' +
        '<span class="free-unit">分</span>' +
      '</div>' +
      '<div class="free-hint" id="freehint_' + esc(dim.id) + '">满分 ' + dim.max + ' 分，自己填</div>' +
    '</div>';
  }

  function openSheet(c) {
    var prev = MY[c.id] || {};
    var rd = curRound();
    /* 只渲染「本轮考察范围」里的打分项 —— 各轮范围可以不同 */
    var ds = roundDims(rd ? rd.id : null);
    var pend = {};
    ds.forEach(function (dm) { pend[dm.id] = dimAnswered(dm, prev[dm.id]) ? prev[dm.id] : null; });
    var origCm = c.comment ? c.comment.text : '';

    var blocks = '';
    ds.forEach(function (dm) {
      blocks += dimIsFree(dm) ? freeBlock(dm, pend[dm.id])
                              : gradeBlock(dm.name, dm.id, dm.levels, pend[dm.id]);
    });
    if (!ds.length) {
      blocks = '<div class="card hint warn" style="margin-top:16px">' +
        '这一轮还没勾选考察的打分项，打不了分。<br>' +
        '点上面提示条里的「去配置」，或到「管理 → 轮次」里勾选。</div>';
    }

    var sheet = $('#sheet');
    /* 三段式：头部固定 + 中间滚动 + 底部常驻（合计 + 保存），手机上软键盘不会盖住保存按钮 */
    sheet.className = 'sheet stack' + (sheet.classList.contains('show') ? ' show' : '');
    sheet.innerHTML = '<div class="sheet-grab"></div>' +
      '<div class="sheet-head"><div><div class="sheet-name">' + esc(c.name) + '</div>' +
      '<div class="sheet-sub">' + (rd ? esc(rd.name) + ' · ' : '') + (c.cls ? esc(c.cls) + ' · ' : '') + '打分人：' + esc(ME.interviewer) +
      ' · 考察 ' + ds.length + ' 项</div></div>' +
      '<button class="sheet-close" id="sheetClose">关闭</button></div>' +
      '<div class="sheet-body">' +
        blocks +
        '<div class="grade-block"><div class="grade-label">评语</div>' +
          '<textarea id="cmBox" class="cm-box" maxlength="200" placeholder="写下对这位面试者的评语（可以打分时写，打分后再来改）">' +
          esc(origCm) + '</textarea>' +
          (c.comment ? '<div class="cm-meta">当前评语由 ' + esc(c.comment.by) + ' 填写 · ' + tsStr(c.comment.ts) + '</div>' : '') +
        '</div>' +
      '</div>' +
      '<div class="sheet-foot">' +
        '<div class="total-line"><span>本次合计</span><b id="totalNum">—</b></div>' +
        '<button class="btn-primary" id="saveBtn" disabled>保存</button>' +
      '</div>';

    showSheet('#sheet');
    var cmBox = $('#cmBox');

    function gradeOk() {
      return ds.length > 0 && ds.every(function (dm) { return dimAnswered(dm, pend[dm.id]); });
    }
    function gradeSum() {
      var sum = 0;
      ds.forEach(function (dm) { if (dimAnswered(dm, pend[dm.id])) sum += dimScore(dm.id, pend[dm.id]); });
      return sum;
    }

    function refresh() {
      var ok = gradeOk();
      var cmOk = cmBox.value.trim() !== origCm;   // 评语有改动才允许「只存评语」
      $('#totalNum').textContent = ok ? (gradeSum() + ' 分') : '—';
      $('#saveBtn').disabled = !(ok || cmOk);
      /* 自由填分越界时标红 */
      ds.forEach(function (dm) {
        if (!dimIsFree(dm)) return;
        var inp = $('#free_' + dm.id);
        if (!inp) return;
        var raw = inp.value.trim();
        var bad = raw !== '' && !dimAnswered(dm, raw);
        inp.classList.toggle('bad', bad);
        var hint = $('#freehint_' + dm.id);
        if (hint) {
          hint.className = 'free-hint' + (bad ? ' bad' : '');
          hint.textContent = bad ? ('要填 0 ~ ' + dm.max + ' 之间的分数') : ('满分 ' + dm.max + ' 分，自己填');
        }
      });
    }

    sheet.querySelectorAll('.grade').forEach(function (btn) {
      btn.onclick = function () {
        vib();
        var dim = btn.getAttribute('data-dim');
        pend[dim] = btn.getAttribute('data-key');
        sheet.querySelectorAll('.grade[data-dim="' + dim + '"]').forEach(function (b) { b.classList.remove('on'); });
        btn.classList.add('on');
        refresh();
      };
    });

    /* 自由填分：数字输入框 */
    ds.forEach(function (dm) {
      if (!dimIsFree(dm)) return;
      var inp = $('#free_' + dm.id);
      if (!inp) return;
      inp.oninput = function () {
        inp.value = inp.value.replace(/[^0-9.]/g, '');
        pend[dm.id] = inp.value.trim() === '' ? null : Number(inp.value);
        refresh();
      };
      inp.onfocus = function () {
        setTimeout(function () {
          try { inp.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {}
        }, 280);
      };
    });

    $('#sheetClose').onclick = hideSheets;
    $('#saveBtn').onclick = function () {
      $('#saveBtn').disabled = true;
      var cmText = cmBox.value.trim();
      var hasGrade = gradeOk();
      var dims = {};
      ds.forEach(function (dm) { if (dimAnswered(dm, pend[dm.id])) dims[dm.id] = pend[dm.id]; });
      var jobs = [];
      if (cmText !== origCm) jobs.push(post('/api/comment', { c: c.id, text: cmText, by: ME.interviewer }));
      if (hasGrade) jobs.push(post('/api/score', { r: rd ? rd.id : '', g: CURGROUP, c: c.id, i: ME.interviewer, dims: dims }));
      Promise.all(jobs).then(function (res) {
        var ci = 0;
        if (cmText !== origCm) {
          var jc = res[ci++];
          if (jc && jc.candidate) {
            CFG.candidates = CFG.candidates.map(function (x) { return x.id === jc.candidate.id ? jc.candidate : x; });
          }
        }
        if (hasGrade) {
          MY[c.id] = dims;
          LOCK[c.id] = CURGROUP;
        }
        vib(20); hideSheets(); render();
        toast(hasGrade ? '已保存' : '评语已保存');
        if (hasGrade) {
          setTimeout(function () {
            var cands = CFG.candidates;
            var idx = 0;
            cands.forEach(function (cc, i) { if (cc.id === c.id) idx = i; });
            for (var k = 1; k <= cands.length; k++) {
              var nx = cands[(idx + k) % cands.length];
              if (LOCK[nx.id] && LOCK[nx.id] !== CURGROUP) continue;
              if (!isDone(nx.id)) { openSheet(nx); return; }
            }
            toast('本组已全部打分完成');
          }, 300);
        }
      }).catch(function (e) { $('#saveBtn').disabled = false; toast('保存失败：' + e.message); });
    };

    refresh();
  }

  /* ================= 面试者名单（首页入口，所有组共用） ================= */
  function openCands() {
    paintCands();
    showSheet('#asheet');
  }

  function paintCands() {
    var sheet = $('#asheet');
    sheet.innerHTML = '<div class="sheet-grab"></div>' +
      '<div class="sheet-head"><div><div class="sheet-name">面试者名单</div>' +
      '<div class="sheet-sub">所有小组共用 · 按班级 + 姓名添加，支持批量导入</div></div>' +
      '<button class="sheet-close" id="aClose">完成</button></div>' +
      '<div class="m-sec"><div class="grade-label">单个添加</div>' +
        '<div class="add-row"><input class="c-cls" id="cCls" maxlength="30" placeholder="班级，如 软件2301">' +
        '<input id="cName" maxlength="20" placeholder="姓名"><button id="cAdd">添加</button></div></div>' +
      '<div class="m-sec batch-box"><div class="grade-label">批量导入</div>' +
        '<textarea id="cBatch" placeholder="每行一位：班级 姓名（空格分隔）&#10;例如：&#10;软件2301 张三&#10;大数据2302 李四&#10;也可以只写姓名"></textarea>' +
        '<button class="btn-batch" id="cBatchBtn">批量导入</button></div>' +
      '<div class="m-sec"><div class="grade-label">已添加 ' + CFG.candidates.length + ' 人（点 × 删除）</div>' +
        '<div class="chip-wrap" id="cList"></div></div>';

    $('#aClose').onclick = hideSheets;

    var box = $('#cList');
    if (!CFG.candidates.length) {
      box.innerHTML = '<span style="color:#98a2b3;font-size:13.5px">还没有添加</span>';
    } else {
      CFG.candidates.forEach(function (c) {
        var label = (c.cls ? c.cls + ' ' : '') + c.name;
        var t = el('span', 'tag', esc(label) + '<i>×</i>');
        t.querySelector('i').onclick = function () {
          askConfirm({
            title: '从名单移除面试者',
            name: label,
            lines: ['所有组里他/她的打分记录也会一并删除，无法恢复。'],
            okText: '移除',
            danger: true
          }).then(function (yes) {
            if (!yes) return;
            cdManage('del', { id: c.id }).then(function () { paintCands(); });
          });
        };
        box.appendChild(t);
      });
    }

    var clsInp = $('#cCls'), nameInp = $('#cName');
    function add() {
      var v = nameInp.value.trim();
      if (!v) { toast('请输入姓名'); return; }
      cdManage('add', { name: v, cls: clsInp.value.trim() })
        .then(function () { nameInp.value = ''; nameInp.focus(); paintCands(); })
        .catch(function () {});
    }
    $('#cAdd').onclick = add;
    nameInp.onkeydown = function (e) { if (e.key === 'Enter') add(); };

    $('#cBatchBtn').onclick = function () {
      var items = [];
      $('#cBatch').value.split(/\n+/).forEach(function (line) {
        var t = line.trim().split(/\s+/);
        if (!t[0]) return;
        if (t.length >= 2) items.push({ cls: t[0], name: t.slice(1).join('') });
        else items.push({ cls: '', name: t[0] });
      });
      if (!items.length) { toast('请先粘贴名单，每行一位'); return; }
      cdManage('batch', { items: items })
        .then(function (j) {
          $('#cBatch').value = '';
          toast('已导入 ' + j.added + ' 人' + (j.skipped ? '，跳过 ' + j.skipped + ' 人（已存在或姓名无效）' : ''));
          paintCands();
        })
        .catch(function () {});
    };
  }

  function cdManage(op, payload) {
    var body = { kind: 'cd', op: op };
    Object.keys(payload).forEach(function (k) { body[k] = payload[k]; });
    return post('/api/manage', body).then(function (j) {
      CFG.candidates = j.candidates;
      vib(18);
      if (op === 'del') toast('已移除');
      if (VIEW === 'rank') renderRank(); else render();
      return j;
    }).catch(function (e) { toast(e.message); throw e; });
  }

  /* ================= 排名页（默认当前轮次的统一排名，各轮分数隔离；可选看全部轮次总排名） ================= */
  function renderRank() {
    if (RANK_ROUND && !roundById(RANK_ROUND)) RANK_ROUND = null;
    var main = $('#main'); main.innerHTML = '';
    $('#backBtn').hidden = true;
    $('#topTitle').textContent = '平均分排名';
    main.appendChild(el('div', 'card hint', '加载中…'));

    var overall = !RANK_ROUND;
    var rd = overall ? null : roundById(RANK_ROUND);
    $('#topSub').textContent = overall
      ? '全部轮次 · 总平均分排名'
      : rd.name + ' · 全部组统一排名（各轮分数隔离）';

    api(overall ? '/api/rank?overall=1' : '/api/rank?r=' + encodeURIComponent(RANK_ROUND)).then(function (j) {
      RANK = j.rows || [];
      paintRank();
    }).catch(function (e) {
      main.innerHTML = '';
      main.appendChild(el('div', 'card hint warn', '加载失败：' + esc(e.message)));
    });
  }

  function paintRank() {
    var main = $('#main'); main.innerHTML = '';

    // 轮次切换：各轮排名隔离，另可选「全部」看总排名
    var rChips = el('div', 'card rank-round-card');
    var cw = el('div', 'chip-wrap');
    (CFG.rounds || []).forEach(function (x) {
      var b = el('button', 'chip' + (RANK_ROUND === x.id ? ' on' : ''), esc(x.name));
      b.onclick = function () { vib(); RANK_ROUND = x.id; renderRank(); };
      cw.appendChild(b);
    });
    var allB = el('button', 'chip' + (RANK_ROUND === null ? ' on' : ''), '全部（总）');
    allB.onclick = function () { vib(); RANK_ROUND = null; renderRank(); };
    cw.appendChild(allB);
    rChips.appendChild(el('div', 'card-title', '看哪一轮的排名（分数按轮隔离统计）'));
    rChips.appendChild(cw);
    if (RANK_ROUND) {
      var sds = roundDims(RANK_ROUND);
      rChips.appendChild(el('div', 'hint', '<span style="font-size:12.5px;color:#98a2b3">本轮考察 ' +
        sds.length + ' 项：' + esc(sds.map(function (d) { return d.name; }).join('、')) +
        '（满分 ' + dimsMax(RANK_ROUND) + ' 分）</span>'));
    } else if (roundsScopeDiffer()) {
      rChips.appendChild(el('div', 'hint warn', '<span style="font-size:12.5px">各轮考察的打分项不同，' +
        '跨轮的总平均分不能直接比较，建议按单轮查看。</span>'));
    }
    main.appendChild(rChips);

    if (!RANK.length) {
      main.appendChild(el('div', 'card empty', '还没有面试者名单<br><span style="font-size:13px">到首页「面试者名单」里添加</span>'));
      return;
    }
    var any = false;
    RANK.forEach(function (r) { if (r.count > 0) any = true; });
    var rdName = RANK_ROUND ? (roundById(RANK_ROUND) || {}).name : '';
    if (!any) { main.appendChild(el('div', 'card empty', (rdName ? rdName : '全部轮次') + '还没有人打分')); return; }

    RANK.forEach(function (r) {
      if (r.count === 0) {
        var e2 = el('div', 'rank-row');
        e2.innerHTML = '<div class="medal">—</div><div class="rank-main">' +
          '<div class="rank-name">' + esc(r.name) + (r.cls ? '<em class="c-cls">' + esc(r.cls) + '</em>' : '') + '</div>' +
          '<div class="rank-sub">还没有面试官打分</div></div>';
        main.appendChild(e2);
        return;
      }
      var cls = r.rank === 1 ? ' m1' : r.rank === 2 ? ' m2' : r.rank === 3 ? ' m3' : '';
      var sub = r.count + ' 条打分记录 · 点击看明细';
      var row = el('button', 'rank-row');
      row.innerHTML = '<div class="medal' + cls + '">' + r.rank + '</div>' +
        '<div class="rank-main"><div class="rank-name">' + esc(r.name) +
        (r.cls ? '<em class="c-cls">' + esc(r.cls) + '</em>' : '') + '</div>' +
        '<div class="rank-sub">' + sub + '</div></div>' +
        '<div class="rank-score"><b>' + r.avg + '</b><span>平均分</span></div>';

      var detail = el('div', 'rank-detail');
      detail.hidden = true;
      var cmHtml = r.comment
        ? '<div class="rank-comment">评语：' + esc(r.comment.text) + '　<b>—— ' + esc(r.comment.by) + '</b></div>'
        : '';
      detail.innerHTML = cmHtml + r.detail.map(function (d) {
        var parts = (d.items || []).map(function (it) {
          return esc(it.name) + (it.label ? ' ' + esc(it.label) : '') + ' ' + it.score;
        }).join(' + ');
        var who = esc(d.interviewer) + (d.round ? '（' + esc(d.round) + '）' : '');
        return '<div class="d-row"><span>' + who + (parts ? '　' + parts : '') + '</span><b>' + d.total + '</b></div>';
      }).join('');
      row.onclick = function () { detail.hidden = !detail.hidden; };

      main.appendChild(row);
      main.appendChild(detail);
    });
  }

  /* ================= 管理（底部导航第三个 tab）：4 个管理对象，各一个入口 ================= */

    if (MANAGE_SEC === 'iv') return manageIv();
    if (MANAGE_SEC === 'dim') return manageDim();
    if (MANAGE_SEC === 'gp') return manageGp();
    if (MANAGE_SEC === 'rd') return manageRd();

    var main = $('#main'); main.innerHTML = '';
    $('#backBtn').hidden = true;
    $('#topTitle').textContent = '管理';
    $('#topSub').textContent = '面试官 · 打分项 · 小组 · 轮次';

    var defs = [
      { key: 'iv',  name: '面试官', meta: '全局名单共 ' + CFG.interviewers.length + ' 人 · 在「小组」里配置谁参与打分' },
      { key: 'dim', name: '打分项', meta: (CFG.dimensions || []).length + ' 项 · 等级名称 / 分值可编辑' },
      { key: 'gp',  name: '小组',   meta: (CFG.groups || []).length + ' 组 · 每组配置自己的面试官，删组清分数' },
      { key: 'rd',  name: '轮次',   meta: (CFG.rounds || []).length + ' 轮 · 每轮自由配置考察的打分项' }
    ];
    var list = el('div', 'list');
    defs.forEach(function (d) {
      var card = el('button', 'gcard');
      card.innerHTML =
        '<span class="gmain"><span class="gname">' + d.name + '</span>' +
        '<span class="gmeta">' + d.meta + '</span></span>' +
        '<span class="arrow"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></span>';
      card.onclick = function () { vib(); MANAGE_SEC = d.key; renderManage(); };
      list.appendChild(card);

  function secHead(title, sub) {
    $('#backBtn').hidden = false;
    $('#topTitle').textContent = title;
    $('#topSub').textContent = sub;
    var main = $('#main'); main.innerHTML = '';
    return main;
  }

  /* --- 面试官（全局名单池） --- */

    secHead('面试官', '全局名单池 · 在「小组」里配置谁参与打分');
    var main = $('#main'); main.innerHTML = '';
    var cIv = el('div', 'card');
    cIv.innerHTML =
      '<div class="card-title">面试官（点 × 移除，同时移出所有小组并删除其打分）</div>' +
      '<div class="add-row"><input id="mIv" maxlength="20" placeholder="输入面试官姓名"><button id="mIvAdd">添加</button></div>' +
      '<div class="chip-wrap" id="mIvList"></div>';
    main.appendChild(cIv);
    var box = $('#mIvList');
    if (!CFG.interviewers.length) {
      box.innerHTML = '<span style="color:#98a2b3;font-size:13.5px">还没有添加</span>';
    } else {
      CFG.interviewers.forEach(function (n) {
        var t = el('span', 'tag', esc(n) + '<i>×</i>');
        t.querySelector('i').onclick = function () {
          askConfirm({
            title: '移除面试官',
            name: n,
            lines: ['他/她在所有小组里的配置会一并移除。', '他/她打过的分也会被删除，无法恢复。'],
            okText: '移除',
            danger: true
          }).then(function (yes) { if (yes) manage('iv', n, 'del'); });
        };
        box.appendChild(t);
      });
    }
    var ivInp = $('#mIv');
    function addIv() {
      var v = ivInp.value.trim();
      if (!v) return;

    }
    $('#mIvAdd').onclick = addIv;
    ivInp.onkeydown = function (e) { if (e.key === 'Enter') addIv(); };

  /* --- 打分项 --- */
  function manageDim() {
    var main = secHead('打分项', '每个打分项若干等级，等级名与分值随时可改');
    var dims = CFG.dimensions || [];

    var cList = el('div', 'card');
    cList.innerHTML = '<div class="card-title">现有打分项 · 共 ' + dims.length + ' 项</div><div id="dList"></div>';
    main.appendChild(cList);

    var dbox = $('#dList');
    if (!dims.length) {
      dbox.innerHTML = '<div class="empty">还没有打分项<br>点下面的「新建打分项」加一个</div>';
    } else {
      dims.forEach(function (dm) { dbox.appendChild(dimCard(dm, dims.length > 1)); });
    }

    var add = el('button', 'btn-new', '<i>＋</i> 新建打分项');
    add.onclick = function () { vib(); openDimCreator(); };
    main.appendChild(add);

    main.appendChild(el('div', 'hint',
      '<span style="font-size:12.5px;color:#98a2b3">每项 1~6 个等级，分值 0~999。' +
      '改动等级分值后，历史打分按新分值即时重算；删除某项会连带移除它在所有打分里的分数。<br>' +
      '每张卡下面标了它被哪些轮次考察。新建的打分项<b>不会自动进入任何轮次</b>，' +
      '要自己到「管理 → 轮次」里勾选。</span>'));
  }

  /* 单个打分项的卡片 */
  function dimCard(dm, canDel) {
    var free = dimIsFree(dm);
    var scores = free ? [] : dm.levels.map(function (lv) { return lv.score; });
    var range = free
      ? '0 ~ ' + (dm.max || 100) + ' 分'
      : (scores.length ? Math.min.apply(null, scores) + ' ~ ' + Math.max.apply(null, scores) + ' 分' : '没有等级');
    var c = el('div', 'dim-card');
    c.innerHTML =
      '<div class="dim-main">' +
        '<div class="dim-name">' + esc(dm.name) +
          (free ? '<span class="dim-mode">自由填分</span>' : '') + '</div>' +
        '<div class="dim-meta">' + (free ? '面试官自己填分 · ' : dm.levels.length + ' 个等级 · ') + range + '</div>' +
        '<div class="dim-lvs">' + (free
          ? '<span class="dim-lv">自由填分<b>0~' + (dm.max || 100) + '</b></span>'
          : dm.levels.map(function (lv) {
              return '<span class="dim-lv">' + esc(lv.label) + '<b>' + lv.score + '</b></span>';
            }).join('')) + '</div>' +
        '<div class="dim-use">' + esc(dimUsage(dm.id)) + '</div>' +
      '</div>' +
      '<div class="dim-acts">' +
        '<button class="a-ed" title="编辑名称与等级">✎</button>' +
        (canDel ? '<button class="a-del" title="删除该打分项">×</button>' : '') +
      '</div>';
    c.querySelector('.a-ed').onclick = function () { vib(); openLevelEditor(dm.id); };
    if (canDel) c.querySelector('.a-del').onclick = function () {
      vib();
      askConfirm({
        title: '删除打分项',
        name: dm.name,
        lines: ['它在所有打分记录里的分数会一并移除。',
                '它会从各轮次的考察范围里移除。',
                '此操作无法恢复。'],
        okText: '删除',
        danger: true
      }).then(function (yes) { if (yes) dimManage('del', { id: dm.id }); });
    };
    return c;
  }

  /* 新建打分项：弹窗表单 */
  function openDimCreator() {
    openDimForm({
      title: '新建打分项',
      sub: '选一种打分方式：固定等级，或让面试官自由填分',
      saveText: '保存打分项',
      name: '',
      mode: 'level',
      max: 100,
      rows: [
        { key: '', label: '', score: '', ph: ['如 偏弱', '60'] },
        { key: '', label: '', score: '', ph: ['如 良好', '75'] },
        { key: '', label: '', score: '', ph: ['如 优秀', '90'] }
      ],
      onSave: function (p) {
        return dimManage('add', { name: p.name, mode: p.mode, max: p.max, levels: p.levels });
      }
    });
  }

  /* 编辑已有打分项：改名称 / 类型 / 等级 */
  function openLevelEditor(id) {
    var ed = dimById(id);
    if (!ed) return;
    var free = dimIsFree(ed);
    openDimForm({
      title: '编辑打分项',
      sub: free ? '改名称或满分；换成「选等级」会清掉该项历史分数'
                : '改名称 / 等级后点保存，历史分数按新分值重算',
      saveText: '保存修改',
      name: ed.name,
      selfId: id,
      mode: free ? 'free' : 'level',
      origMode: free ? 'free' : 'level',
      max: ed.max || 100,
      rows: free ? [] : ed.levels.map(function (l) { return { key: l.key, label: l.label, score: l.score }; }),
      onSave: function (p) {
        return dimManage('edit', { id: id, name: p.name, mode: p.mode, max: p.max, levels: p.levels });
      }
    });
  }

  /* 打分项表单弹窗：新建与编辑共用
     cfg = { title, sub, saveText, name, rows:[{key,label,score,ph?}], selfId?, onSave(payload)->Promise } */
  function openDimForm(cfg) {
    var sheet = $('#dsheet');
    /* 从「本轮考察的打分项」里就地新建时弹层已经开着：原地换内容，不重播入场动画。
       用 hidden 判断而不是 show 类 —— show 类是在下一动画帧才加上的 */
    var inPlace = !sheet.hidden;
    if (inPlace) {
      clearTimeout(sheet._hideT);
      $('#mask').hidden = false;
      sheet.className = 'sheet stack show';
    } else {
      hideSheets();
      sheet.className = 'sheet stack';
    }
    sheet.innerHTML =
      '<div class="sheet-grab"></div>' +
      '<div class="sheet-head"><div><div class="sheet-name">' + esc(cfg.title) + '</div>' +
      '<div class="sheet-sub">' + esc(cfg.sub) + '</div></div></div>' +
      '<div class="sheet-body">' +
        '<div class="f-label">打分项名称 <em id="dfNameCnt">0/10</em></div>' +
        '<input class="f-input" id="dfName" maxlength="10" placeholder="如 项目经验">' +
        '<div class="f-label">打分方式 <em id="dfModeHint"></em></div>' +
        '<div class="seg" id="dfMode">' +
          '<button type="button" data-mode="level">选等级 · 分值固定</button>' +
          '<button type="button" data-mode="free">自由填分</button>' +
        '</div>' +
        '<div id="dfLevelBox">' +
          '<div class="f-label">等级 <em>等级名 1~10 字，分值 0~999</em></div>' +
          '<div class="lv-head"><span class="h-l">等级名称</span><span class="h-s">分值</span><span class="h-d"></span></div>' +
          '<div id="dfRows"></div>' +
          '<button class="lv-add" id="dfLvAdd">＋ 添加等级</button>' +
        '</div>' +
        '<div id="dfFreeBox" hidden>' +
          '<div class="f-label">满分 <em>1~999</em></div>' +
          '<input class="f-input" id="dfMax" inputmode="numeric" maxlength="3" placeholder="100">' +
          '<div class="hint" style="margin-top:10px"><span style="font-size:12.5px;color:#98a2b3">' +
          '这一项不设等级：打分时面试官自己填 0 ~ 满分之间的分数。</span></div>' +
        '</div>' +
        '<div class="f-label">预览 <em>打分页上会这样显示</em></div>' +
        '<div id="dfPv"></div>' +
        '<div class="form-msg" id="dfMsg"></div>' +
      '</div>' +
      '<div class="sheet-foot row">' +
        '<button class="b-cancel" id="dfCancel">取消</button>' +
        '<button class="b-save" id="dfSave">' + esc(cfg.saveText || '保存') + '</button>' +
      '</div>';
    if (!inPlace) showSheet('#dsheet');

    var nameEl = $('#dfName');
    var rowsEl = $('#dfRows');
    var maxEl = $('#dfMax');
    var name = String(cfg.name || '');
    var mode = cfg.mode === 'free' ? 'free' : 'level';
    var origMode = cfg.origMode === 'free' ? 'free' : 'level';
    var rows = (cfg.rows || []).map(function (r) {
      return {
        key: r.key || '',
        label: r.label == null ? '' : String(r.label),
        score: (r.score === '' || r.score == null) ? '' : String(r.score),
        ph: r.ph || null
      };
    });
    if (!rows.length) rows.push({ key: '', label: '', score: '' });
    var dirty = false;
    var tried = false;
    nameEl.value = name;
    maxEl.value = String(cfg.max || 100);

    /* 切换「选等级 / 自由填分」 */
    function drawMode() {
      sheet.querySelectorAll('#dfMode button').forEach(function (b) {
        b.className = b.getAttribute('data-mode') === mode ? 'on' : '';
      });
      $('#dfLevelBox').hidden = (mode !== 'level');
      $('#dfFreeBox').hidden = (mode !== 'free');
      $('#dfModeHint').textContent = mode === 'free' ? '面试官自己填分' : '每个等级固定分值';
    }
    $('#dfMode').onclick = function (e) {
      var b = e.target && e.target.closest ? e.target.closest('button[data-mode]') : null;
      if (!b) return;
      var m = b.getAttribute('data-mode');
      if (m === mode) return;
      mode = m; dirty = true; vib(); drawMode(); refresh();
    };
    maxEl.oninput = function () {
      maxEl.value = maxEl.value.replace(/[^0-9]/g, '');
      touch();
    };
    drawMode();

    function drawRows() {
      rowsEl.innerHTML = '';
      rows.forEach(function (r, i) {
        var ph = r.ph || ['等级名', '分值'];
        var d = el('div', 'lv-row');
        d.innerHTML =
          '<input class="lv-l" maxlength="10" placeholder="' + esc(ph[0]) + '" value="' + esc(r.label) + '">' +
          '<input class="lv-score" inputmode="numeric" maxlength="3" placeholder="' + esc(ph[1]) + '" value="' + esc(r.score) + '">' +
          '<button class="lv-del" type="button">×</button>';
        var li = d.querySelector('.lv-l'), si = d.querySelector('.lv-score');
        li.oninput = function () { r.label = li.value; touch(); };
        si.oninput = function () { r.score = si.value.replace(/[^0-9]/g, ''); si.value = r.score; touch(); };
        var scroll = function () {
          setTimeout(function () {
            try { d.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {}
          }, 280);
        };
        li.onfocus = scroll; si.onfocus = scroll;
        d.querySelector('.lv-del').onclick = function () {
          if (rows.length <= 1) { toast('至少保留一个等级'); return; }
          vib(); rows.splice(i, 1); dirty = true; drawRows(); refresh();
        };
        rowsEl.appendChild(d);
      });
      $('#dfLvAdd').style.display = rows.length >= 6 ? 'none' : '';
    }

    function drawPv() {
      if (mode === 'free') {
        var mx = Number(maxEl.value);
        var show = (isFinite(mx) && mx >= 1 && mx <= 999) ? mx : '—';
        $('#dfPv').innerHTML = '<div class="free-preview"><b>—</b><span>分</span>' +
          '<em>面试官自己填 0 ~ ' + show + '</em></div>';
        return;
      }
      var used = rows.filter(function (r) { return r.label.trim() || String(r.score).trim(); });
      $('#dfPv').innerHTML = '<div class="lv-preview">' + (used.length
        ? used.map(function (r) {
            var lab = r.label.trim() || '未命名';
            var sc = String(r.score).trim() === '' ? '—' : String(r.score);
            return '<span class="lv-pv"><em>' + esc(lab) + '</em><b>' + esc(sc) + ' 分</b></span>';
          }).join('')
        : '<span class="lv-pv none"><em>还没填等级</em><b>—</b></span>') + '</div>';
    }

    /* 校验：完全空白的等级行视为未使用，不计入也不报错；自由填分型只校验满分 */
    function check() {
      var n = name.trim();
      var errs = [];
      var rowBad = {};
      var dup = (CFG.dimensions || []).some(function (x) { return x.id !== cfg.selfId && x.name === n; });
      if (!n) errs.unshift('请填写打分项名称');
      else if (dup) errs.unshift('「' + n + '」已经有了，换个名字');

      if (mode === 'free') {
        var raw = String(maxEl.value).trim();
        var mn = Number(raw);
        var okMax = raw !== '' && isFinite(mn) && mn >= 1 && mn <= 999;
        if (!okMax) errs.push('满分要填 1~999');
        return { name: n, mode: 'free', max: okMax ? Math.round(mn) : null,
                 levels: [], errs: errs, rowBad: rowBad, dup: dup, ok: errs.length === 0 };
      }

      var lvs = [];
      rows.forEach(function (r, i) {
        var lab = r.label.trim();
        var rawS = String(r.score).trim();
        if (!lab && !rawS) return;                       // 空行，忽略
        var sc = rawS === '' ? NaN : Number(rawS);
        if (!lab) { rowBad[i] = 1; errs.push('第 ' + (i + 1) + ' 行还差等级名称'); return; }
        if (lab.length > 10) { rowBad[i] = 1; errs.push('第 ' + (i + 1) + ' 行等级名太长了'); return; }
        if (!isFinite(sc) || sc < 0 || sc > 999) { rowBad[i] = 1; errs.push('第 ' + (i + 1) + ' 行分值要填 0~999'); return; }
        lvs.push({ key: r.key || '', label: lab, score: Math.round(sc) });
      });
      if (!lvs.length && !errs.length) errs.push('请至少填写一个等级（等级名 + 分值）');
      return { name: n, mode: 'level', max: null, levels: lvs,
               errs: errs, rowBad: rowBad, dup: dup, ok: errs.length === 0 };
    }

    /* 改了类型时提示历史分数会怎么处理 */
    function modeWarn() {
      if (!cfg.selfId || mode === origMode) return '';
      return mode === 'free'
        ? '注意：原来选的等级会按各自分值换算成自由分。'
        : '注意：自由分没法换算成等级，这一项的历史分数会被清掉。';
    }

    function refresh() {
      var v = check();
      nameEl.classList.toggle('bad', (tried || !!name.trim()) && (!v.name || v.dup));
      if (mode === 'level') {
        var rowEls = rowsEl.querySelectorAll('.lv-row');
        for (var i = 0; i < rowEls.length; i++) rowEls[i].classList.toggle('bad', !!v.rowBad[i]);
      } else {
        maxEl.classList.toggle('bad', (tried || String(maxEl.value).trim() !== '') && !v.max);
      }
      $('#dfSave').disabled = !v.ok;
      var msg = $('#dfMsg');
      if (v.ok) {
        msg.className = 'form-msg ok';
        msg.textContent = (mode === 'free'
          ? '填写完成：面试官打分时自己填 0~' + v.max + ' 分。'
          : '填写完成，点下面「' + (cfg.saveText || '保存') + '」即可生效。') + modeWarn();
      } else {
        msg.className = 'form-msg err';
        msg.textContent = v.errs[0] + (v.errs.length > 1 ? '（共 ' + v.errs.length + ' 处待完善）' : '');
      }
      drawPv();
    }

    function touch() { dirty = true; refresh(); }

    drawRows();
    refresh();

    nameEl.oninput = function () {
      name = nameEl.value;
      $('#dfNameCnt').textContent = name.trim().length + '/10';
      touch();
    };
    $('#dfNameCnt').textContent = name.trim().length + '/10';
    nameEl.onkeydown = function (e) {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      var first = rowsEl.querySelector('.lv-l');
      if (first) first.focus();
    };
    $('#dfLvAdd').onclick = function () {
      if (rows.length >= 6) { toast('最多 6 个等级'); return; }
      vib(); rows.push({ key: '', label: '', score: '' }); dirty = true; drawRows(); refresh();
      var last = rowsEl.lastElementChild;
      if (last) last.querySelector('.lv-l').focus();
    };

    /* 关掉表单：默认整层收起；从别的弹层切过来的，用 onCancel 回到上一层 */
    function leave() {
      if (cfg.onCancel) cfg.onCancel(); else hideSheets();
    }
    function tryClose() {
      if (!dirty) { leave(); return; }
      askConfirm({
        title: '放弃未保存的修改？',
        lines: ['刚填的内容不会保存。'],
        okText: '放弃修改',
        cancelText: '继续填写',
        danger: true
      }).then(function (yes) { if (yes) leave(); });
    }
    $('#dfCancel').onclick = tryClose;

    $('#dfSave').onclick = function () {
      tried = true;
      var v = check();
      if (!v.ok) { refresh(); toast(v.errs[0]); return; }
      var btn = $('#dfSave');
      btn.disabled = true;
      btn.textContent = '保存中…';
      cfg.onSave({ name: v.name, mode: v.mode, max: v.max, levels: v.levels }).then(function () {
        dirty = false;
        if (cfg.afterSave) cfg.afterSave(); else hideSheets();
      }).catch(function (e) {
        toast(e.message || '保存失败');
        btn.disabled = false;
        btn.textContent = cfg.saveText || '保存';
      });
    };
  }
