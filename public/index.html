<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>面试打分</title>
<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --ink:#101828;
  --ink2:#667085;
  --ink3:#98a2b3;
  --line:#eef0f4;
  --brand:#3d5bfd;
  --brand2:#6b5cff;
  --bad:#f04438;
  --warn:#f79009;
  --good:#12b76a;
  --sh-sm:0 1px 2px rgba(16,24,40,.05);
  --sh:0 6px 20px rgba(16,24,40,.07);
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;overscroll-behavior-y:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;font-feature-settings:"tnum";
}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font-family:inherit}

/* ---------- 顶栏 ---------- */
.appbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;
  background:rgba(245,247,251,.86);backdrop-filter:saturate(180%) blur(16px);
}
.appbar-l{flex:1;min-width:0}
.appbar-title{font-size:19px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar-sub{font-size:12.5px;color:var(--ink2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{
  flex:none;width:38px;height:38px;border-radius:12px;background:var(--card);
  box-shadow:var(--sh-sm);display:flex;align-items:center;justify-content:center;color:var(--ink2);
  transition:.15s;
}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

main{padding:4px 14px 100px}

/* ---------- 组列表 ---------- */
.gcard{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);
  border-radius:var(--r);box-shadow:var(--sh-sm);padding:18px 16px;margin-bottom:11px;transition:.16s;
}
.gcard:active{transform:scale(.985);box-shadow:var(--sh)}
.gbadge{
  flex:none;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#4a6cf7,#6b5cff);color:#fff;font-size:19px;font-weight:800;
  box-shadow:0 6px 16px rgba(74,108,247,.28);
}
.gmain{flex:1;min-width:0}
.gname{display:block;font-size:17px;font-weight:700;letter-spacing:-.2px}
.gmeta{display:block;font-size:12.5px;color:var(--ink3);margin-top:3px}
.arrow{flex:none;color:#d0d5dd}
.arrow svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 主视觉卡 ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:22px;padding:20px;margin-bottom:16px;
  background:linear-gradient(135deg,#4a6cf7 0%,#6b5cff 100%);
  box-shadow:0 10px 28px rgba(74,108,247,.28);color:#fff;
}
.hero::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-62px;top:-78px;background:rgba(255,255,255,.13)}
.hero-top{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hero-group{font-size:22px;font-weight:800;letter-spacing:-.3px}
.hero-iv{font-size:13px;opacity:.9;margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero-switch{
  font-size:11.5px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.22);
  color:#fff;font-weight:600;
}
.hero-num{text-align:right;line-height:1;flex:none}
.hero-num b{font-size:30px;font-weight:800;letter-spacing:-1px}
.hero-num span{font-size:14px;opacity:.8;margin-left:1px}
.hero-num em{display:block;font-size:11.5px;font-style:normal;opacity:.8;margin-top:5px}
.hero-bar{position:relative;height:6px;border-radius:99px;background:rgba(255,255,255,.25);margin-top:16px;overflow:hidden}
.hero-bar i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .35s cubic-bezier(.22,.8,.28,1)}

/* ---------- 通用 ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh-sm);padding:16px;margin-bottom:14px}
.card-title{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:12px;letter-spacing:.3px}
.hint{color:var(--ink2);font-size:14px;line-height:1.75}
.hint.warn{color:#b54708}
.empty{text-align:center;padding:30px 20px;color:var(--ink3);font-size:14px;line-height:1.9}

.chip-wrap{display:flex;flex-wrap:wrap;gap:9px}
.chip{
  padding:10px 18px;border-radius:999px;background:#f4f6fa;font-size:15.5px;font-weight:500;
  border:1.5px solid transparent;transition:.16s;
}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip:active{transform:scale(.96)}

/* ---------- 面试者列表 ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.cand{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--card);
  border-radius:16px;box-shadow:var(--sh-sm);padding:16px;transition:.16s;
}
.cand:active{transform:scale(.985);box-shadow:var(--sh)}
.cand .idx{
  flex:none;width:28px;height:28px;border-radius:9px;background:#f4f6fa;color:var(--ink3);
  font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.cand.done .idx{background:#eafaf1;color:var(--good)}
.cand.lock{opacity:.55}
.cand.lock:active{transform:none;box-shadow:var(--sh-sm)}
.cand-main{flex:1;min-width:0}
.cand-name{display:block;font-size:16.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cand-cmt{display:block;font-size:12px;color:var(--ink2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cand-tag{flex:none;font-size:13px;font-weight:700;color:var(--brand);background:#eef1ff;padding:5px 12px;border-radius:999px}
.cand-tag.empty{color:var(--ink3);background:#f4f6fa;font-weight:500}

/* ---------- 评语 ---------- */
.cm-box{
  width:100%;min-height:72px;padding:12px 14px;border-radius:13px;border:1.5px solid var(--line);
  background:#fafbfd;font-size:14.5px;color:var(--ink);outline:none;resize:vertical;
  font-family:inherit;line-height:1.6;transition:.16s;
}
.cm-box:focus{border-color:var(--brand);background:#fff}
.cm-meta{font-size:12px;color:var(--ink3);margin-top:6px}
.rank-comment{
  margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line);
  font-size:12.5px;color:var(--ink2);line-height:1.6;
}
.rank-comment b{color:var(--ink);font-weight:600}

/* ---------- 排名 ---------- */
.rank-row{
  display:flex;align-items:center;gap:13px;background:var(--card);border-radius:16px;
  box-shadow:var(--sh-sm);padding:15px 16px;margin-bottom:10px;width:100%;text-align:left;transition:.16s;
}
.rank-row:active{transform:scale(.99)}
.medal{
  flex:none;width:32px;height:32px;border-radius:11px;background:#f4f6fa;color:var(--ink3);
  font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;
}
.medal.m1{background:linear-gradient(135deg,#ffd75e,#f7a928);color:#fff;box-shadow:0 4px 12px rgba(247,169,40,.35)}
.medal.m2{background:linear-gradient(135deg,#dfe4ec,#aeb8c8);color:#fff}
.medal.m3{background:linear-gradient(135deg,#f2b98f,#cd7a45);color:#fff}
.rank-main{flex:1;min-width:0}
.rank-name{font-size:16.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-sub{font-size:12px;color:var(--ink3);margin-top:3px}
.rank-score{flex:none;text-align:right}
.rank-score b{font-size:22px;font-weight:800;color:var(--brand);letter-spacing:-.5px}
.rank-score span{font-size:11px;color:var(--ink3);display:block}
.rank-detail{
  margin:-4px 0 12px;padding:13px 16px;background:#fafbfd;border:1px solid var(--line);
  border-radius:14px;font-size:13px;color:#475467;
}
.rank-detail .d-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.rank-detail .d-row b{color:var(--ink);flex:none}

/* ---------- 底部导航 ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav button{
  flex:1;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;font-weight:600;color:var(--ink3);transition:.16s;
}
.nav button.on{color:var(--brand)}
.nav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:40;backdrop-filter:blur(2px)}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);
  border-radius:24px 24px 0 0;max-height:92vh;overflow-y:auto;
  padding:8px 18px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(101%);transition:transform .28s cubic-bezier(.22,.8,.28,1);
  box-shadow:0 -8px 40px rgba(16,24,40,.18);-webkit-overflow-scrolling:touch;
}
.sheet.show{transform:translateY(0)}
.sheet-grab{width:38px;height:4.5px;border-radius:99px;background:#e4e7ec;margin:6px auto 12px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-name{font-size:21px;font-weight:700;letter-spacing:-.3px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-sub{font-size:12.5px;color:var(--ink3);margin-top:2px}
.sheet-close{flex:none;font-size:13.5px;font-weight:600;color:var(--ink2);padding:7px 12px;border-radius:11px;background:#f4f6fa}
.sheet-close:active{transform:scale(.95)}

.grade-block{margin-top:20px}
.grade-label{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:10px;letter-spacing:.2px}
.grade-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.grade{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:16px 4px;
  border-radius:15px;background:#f4f6fa;border:1.5px solid transparent;
  font-size:15px;font-weight:600;color:var(--ink);transition:.16s;
}
.grade span{font-size:12px;font-weight:500;color:var(--ink3)}
.grade:active{transform:scale(.96)}
.grade.on{color:#fff;border-color:transparent}
.grade.on span{color:rgba(255,255,255,.88)}
.grade[data-i="0"].on{background:linear-gradient(135deg,#fb7a6e,#f04438);box-shadow:0 6px 16px rgba(240,68,56,.28)}
.grade[data-i="1"].on{background:linear-gradient(135deg,#fbbf5c,#f79009);box-shadow:0 6px 16px rgba(247,144,9,.28)}
.grade[data-i="2"].on{background:linear-gradient(135deg,#3ecf8e,#12b76a);box-shadow:0 6px 16px rgba(18,183,106,.28)}

.total-line{
  margin-top:20px;padding:14px 18px;border-radius:15px;background:#f4f6fb;
  display:flex;align-items:center;justify-content:space-between;font-size:13.5px;color:var(--ink2);
}
.total-line b{font-size:23px;font-weight:800;color:var(--brand);letter-spacing:-.5px}
.btn-primary{
  width:100%;margin-top:14px;padding:16px;border-radius:15px;
  background:linear-gradient(135deg,#4a6cf7,#6b5cff);color:#fff;font-size:16.5px;font-weight:700;
  box-shadow:0 8px 20px rgba(74,108,247,.32);transition:.16s;
}
.btn-primary:disabled{background:#dfe3ec;box-shadow:none;color:#fff}
.btn-primary:active{transform:scale(.985)}

/* ---------- 管理 / 添加 ---------- */
.m-sec{margin-top:20px}
.add-row{display:flex;gap:9px;margin-bottom:12px}
.add-row input{
  flex:1;min-width:0;padding:13px 15px;border-radius:13px;border:1.5px solid var(--line);
  background:#fafbfd;font-size:16px;color:var(--ink);outline:none;transition:.16s;
}
.add-row input:focus{border-color:var(--brand);background:#fff}
.add-row input::placeholder{color:var(--ink3)}
.add-row button{
  flex:none;padding:0 22px;border-radius:13px;background:var(--ink);color:#fff;
  font-size:15px;font-weight:600;transition:.16s;
}
.add-row button:active{transform:scale(.95)}
.tag{
  display:inline-flex;align-items:center;gap:7px;padding:8px 10px 8px 15px;border-radius:999px;
  background:#f4f6fa;font-size:14.5px;font-weight:500;
}
.tag i{
  width:20px;height:20px;border-radius:50%;background:#e4e7ec;color:var(--ink2);
  font-style:normal;font-size:13px;line-height:20px;text-align:center;font-weight:700;
}
.tag i:active{background:#fda29b;color:#fff}

/* ---------- 首页「面试者名单」入口 / 批量导入 ---------- */
.gbadge.add{background:linear-gradient(135deg,#12b76a,#3ecf8e);box-shadow:0 6px 16px rgba(18,183,106,.28)}
.gbadge.add svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.add-row input.c-cls{flex:0 0 32%}
.batch-box textarea{
  width:100%;min-height:92px;padding:12px 14px;border-radius:13px;border:1.5px solid var(--line);
  background:#fafbfd;font-size:14.5px;color:var(--ink);outline:none;resize:vertical;font-family:inherit;line-height:1.8;
}
.batch-box textarea:focus{border-color:var(--brand);background:#fff}
.lv-text{
  width:100%;min-height:70px;margin-top:4px;padding:12px 14px;border-radius:13px;border:1.5px solid var(--line);
  background:#fafbfd;font-size:14.5px;color:var(--ink);outline:none;resize:vertical;font-family:inherit;line-height:1.8;
}
.lv-text:focus{border-color:var(--brand);background:#fff}
.dim-list{margin-top:10px}
.btn-batch{
  width:100%;margin-top:10px;padding:13px;border-radius:13px;background:var(--ink);color:#fff;
  font-size:15px;font-weight:600;transition:.16s;
}
.btn-batch:active{transform:scale(.98)}
.c-cls{font-style:normal;font-size:12.5px;color:var(--ink3);font-weight:500;margin-left:8px}

.toast{
  position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:rgba(16,24,40,.92);color:#fff;font-size:14px;padding:11px 22px;border-radius:999px;
  z-index:90;max-width:82vw;text-align:center;box-shadow:0 8px 24px rgba(16,24,40,.25);
}
[hidden]{display:none !important}
</style>
</head>
<body>

<header class="appbar">
  <button class="icon-btn" id="backBtn" hidden>
    <svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>
  </button>
  <div class="appbar-l">
    <div class="appbar-title" id="topTitle">面试打分</div>
    <div class="appbar-sub" id="topSub"></div>
  </div>
</header>

<main id="main"></main>

<nav class="nav">
  <button id="navScore" class="on">
    <svg viewBox="0 0 24 24"><path d="M9 4h6v2H9z"/><path d="M15 5h2a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h2"/><path d="m9 13 2 2 4-4"/></svg>
    打分
  </button>
  <button id="navRank">
    <svg viewBox="0 0 24 24"><rect x="3" y="12" width="4" height="8" rx="1"/><rect x="10" y="7" width="4" height="13" rx="1"/><rect x="17" y="3" width="4" height="17" rx="1"/></svg>
    排名
  </button>
  <button id="navManage">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    管理
  </button>
</nav>

<div class="mask" id="mask" hidden></div>
<section class="sheet" id="sheet" hidden></section>
<section class="sheet" id="asheet" hidden></section>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  var CFG = null;
  var ME = null;          // { interviewer }（全局面试官名单里的名字，任何组通用）
  var MY = {};            // 我已打的分（当前轮次内）：candidateId -> { e, w }
  var MYG = null;         // MY 是哪个「组+轮次」组合拉的（换组/换轮次要重新拉）
  var LOCK = {};          // 当前轮次内面试者已被哪个组评分：candidateId -> 组id（该轮被别的组评过本组就不能再评）
  var CURGROUP = null;    // 当前进入的组
  var CURROUND = null;    // 当前轮次（打分/排名共用；轮次只区分分数归属，组与面试官配置不变）
  var VIEW = 'score';     // score | rank | manage
  var RANK = null;       // 统一排名的行
  var LS_KEY = 'interview_me_v2';
  var API_BASE = location.pathname.replace(/[^\/]*$/, '');

  function $(s) { return document.querySelector(s); }
  function el(t, c, h) { var e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function vib(ms) { try { if (navigator.vibrate) navigator.vibrate(ms || 12); } catch (e) {} }
  function toast(m) {
    var t = $('#toast'); t.textContent = m; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 1900);
  }
  function api(p, o) {
    return fetch(API_BASE + p.replace(/^\//, ''), o).then(function (r) {
      return r.json().catch(function () { return null; }).then(function (j) {
        if (!r.ok) throw new Error((j && j.error) || ('请求失败 ' + r.status));
        return j;
      });
    });
  }
  function post(p, body) {
    return api(p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  }
  function groupById(id) { for (var i = 0; i < CFG.groups.length; i++) if (CFG.groups[i].id === id) return CFG.groups[i]; return null; }
  function roundById(id) { if (!CFG.rounds) return null; for (var i = 0; i < CFG.rounds.length; i++) if (CFG.rounds[i].id === id) return CFG.rounds[i]; return null; }
  function firstRound() { return CFG.rounds && CFG.rounds.length ? CFG.rounds[0] : null; }
  function curRound() { return roundById(CURROUND) || firstRound(); }
  function dimById(id) {
    if (!CFG.dimensions) return null;
    for (var i = 0; i < CFG.dimensions.length; i++) if (CFG.dimensions[i].id === id) return CFG.dimensions[i];
    return null;
  }
  function dimScore(id, key) {
    var dm = dimById(id);
    if (!dm) return 0;
    for (var i = 0; i < dm.levels.length; i++) if (dm.levels[i].key === key) return dm.levels[i].score;
    return 0;
  }
  function dimTotal(dims) {
    var t = 0;
    Object.keys(dims).forEach(function (k) { t += dimScore(k, dims[k]); });
    return t;
  }
  function tsStr(ts) {
    var d = new Date(ts);
    function p(x) { return ('0' + x).slice(-2); }
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function saveME() { try { localStorage.setItem(LS_KEY, JSON.stringify(ME)); } catch (e) {} }
  function meOK() { return !!(ME && CFG.interviewers.indexOf(ME.interviewer) >= 0); }

  /* ================= 启动 ================= */
  function boot() {
    api('/api/config').then(function (cfg) {
      CFG = cfg;
      CURROUND = firstRound() ? firstRound().id : null;
      var saved = null;
      try { saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) {}
      var q = new URLSearchParams(location.search);
      var gid = q.get('g') || (saved && saved.groupId) || '';
      var nm = q.get('n') || (saved && saved.interviewer) || '';
      var g = groupById(gid);
      if (nm && CFG.interviewers.indexOf(nm) >= 0) {
        ME = { interviewer: nm };
        saveME();
        CURGROUP = g ? gid : null;
        if (CURGROUP) loadMine().then(render, render); else render();
      } else render();
    }).catch(function (e) {
      $('#main').innerHTML = '<div class="card hint warn">加载失败：' + esc(e.message) + '<br>请确认服务已启动。</div>';
    });
  }

  function loadMine() {
    if (!ME || !CURGROUP) { MY = {}; LOCK = {}; return Promise.resolve(); }
    var rr = curRound() ? curRound().id : '';
    return Promise.all([
      api('/api/mine?g=' + encodeURIComponent(CURGROUP) + '&i=' + encodeURIComponent(ME.interviewer) + '&r=' + encodeURIComponent(rr)),
      api('/api/scored?r=' + encodeURIComponent(rr))
    ]).then(function (r) {
      MY = {};
      (r[0].list || []).forEach(function (s) { MY[s.c] = s.dims || {}; });
      LOCK = r[1].of || {};
    });
  }

  /* 切换轮次：组、面试官名单、面试者名单都不变，只切换分数归属的轮次 */
  function switchRound(id) {
    if (!id || id === CURROUND || !roundById(id)) return;
    vib();
    CURROUND = id;
    MY = {}; MYG = null;
    if (VIEW === 'rank') { renderRank(); return; }
    if (CURGROUP) {
      var g = groupById(CURGROUP);
      if (g) { loadMine().then(function () { renderCandidates(g); }, function () { renderCandidates(g); }); }
      else render();
    } else render();
  }

  function render() {
    $('#navScore').className = VIEW === 'score' ? 'on' : '';
    $('#navRank').className = VIEW === 'rank' ? 'on' : '';
    $('#navManage').className = VIEW === 'manage' ? 'on' : '';
    if (VIEW === 'rank') return renderRank();
    if (VIEW === 'manage') return renderManage();
    if (!CURGROUP) return renderGroups();
    return renderGroup();
  }

  /* ================= 组列表（首页） ================= */
  function renderGroups() {
    var main = $('#main'); main.innerHTML = '';
    $('#backBtn').hidden = true;
    $('#topTitle').textContent = CFG.title || '面试打分';
    $('#topSub').textContent = '先导入面试者名单，再进入小组打分';

    var entry = el('button', 'gcard');
    entry.innerHTML =
      '<span class="gbadge add"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg></span>' +
      '<span class="gmain"><span class="gname">面试者名单</span>' +
      '<span class="gmeta">共 ' + CFG.candidates.length + ' 人 · 添加 / 批量导入</span></span>' +
      '<span class="arrow"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></span>';
    entry.onclick = function () { vib(); openCands(); };
    main.appendChild(entry);

    var list = el('div', 'list');
    CFG.groups.forEach(function (g, i) {
      var card = el('button', 'gcard');
      card.innerHTML =
        '<span class="gbadge">' + (i + 1) + '</span>' +
        '<span class="gmain"><span class="gname">' + esc(g.name) + '</span>' +
        '<span class="gmeta">进入打分 · 面试官 ' + CFG.interviewers.length + ' 人共用 · ' + ((CFG.rounds || []).length || 1) + ' 轮</span></span>' +
        '<span class="arrow"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></span>';
      card.onclick = function () { vib(); CURGROUP = g.id; render(); };
      list.appendChild(card);
    });
    main.appendChild(list);

    // 页面底部：轮次切换（各轮共用同一套小组与面试官，分数按轮隔离统计）
    var rdList = CFG.rounds || [];
    if (rdList.length > 1) {
      var rc = el('div', 'card');
      rc.appendChild(el('div', 'card-title', '轮次切换'));
      var rw = el('div', 'chip-wrap');
      rdList.forEach(function (x) {
        var b = el('button', 'chip' + (CURROUND === x.id ? ' on' : ''), esc(x.name));
        b.onclick = function () { switchRound(x.id); };
        rw.appendChild(b);
      });
      rc.appendChild(rw);
      rc.appendChild(el('div', 'hint', '<span style="font-size:12.5px;color:#98a2b3">各轮共用同一套小组与面试官，分数按轮单独统计、互不影响</span>'));
      main.appendChild(rc);
    }
  }

  /* ================= 组内 ================= */
  function renderGroup() {
    var g = groupById(CURGROUP);
    if (!g) { CURGROUP = null; return renderGroups(); }

    $('#backBtn').hidden = false;
    $('#topTitle').textContent = g.name;

    if (!meOK()) return renderPickIdentity(g);
    if (MYG !== g.id + '|' + CURROUND) {
      // 换到另一个组/另一轮，重新拉当前「组+轮次」里我打的分
      MYG = g.id + '|' + CURROUND;
      return loadMine().then(function () { renderCandidates(g); },
                              function () { renderCandidates(g); });
    }
    renderCandidates(g);
  }

  /* --- 选一次自己是谁（全局名单，任何组通用） --- */
  function renderPickIdentity(g) {
    $('#topSub').textContent = '请选择你是哪位面试官';
    var main = $('#main'); main.innerHTML = '';

    if (!CFG.interviewers.length) {
      main.appendChild(el('div', 'card hint warn',
        '还没有面试官，点底部「管理」添加。'));
      return;
    }

    var card = el('div', 'card');
    card.appendChild(el('div', 'card-title', '你是哪位面试官？'));
    var wrap = el('div', 'chip-wrap');
    CFG.interviewers.forEach(function (n) {
      var b = el('button', 'chip', esc(n));
      b.onclick = function () {
        vib();
        ME = { interviewer: n };
        saveME();
        MYG = g.id + '|' + CURROUND;
        loadMine().then(render, function (e) { toast(e.message); render(); });
      };
      wrap.appendChild(b);
    });
    card.appendChild(wrap);
    card.appendChild(el('div', 'hint', '<span style="font-size:12.5px;color:#98a2b3">只需选一次，之后这台手机会自动记住，在任何小组都通用。</span>'));
    main.appendChild(card);
  }

  /* --- 面试者列表（所有组共用一份名单；当前轮次内已被其他组评分的锁定） --- */
  function renderCandidates(g) {
    var rd = curRound();
    $('#topSub').textContent = g.name + ' · ' + (rd ? rd.name : '') + ' · 面试官 ' + ME.interviewer;
    var main = $('#main'); main.innerHTML = '';

    var lockedOf = function (c) {
      return LOCK[c.id] && LOCK[c.id] !== g.id ? LOCK[c.id] : null;
    };
    var cands = CFG.candidates;
    var usable = cands.filter(function (c) { return !lockedOf(c); });
    var total = usable.length;
    var done = 0;
    usable.forEach(function (c) { if (MY[c.id] && Object.keys(MY[c.id]).length) done++; });

    var hero = el('div', 'hero');
    hero.innerHTML =
      '<div class="hero-top">' +
        '<div><div class="hero-group">' + esc(g.name) + '</div>' +
        '<div class="hero-iv">面试官 ' + esc(ME.interviewer) +
        '<button class="hero-switch" id="switchIv">切换</button></div></div>' +
        '<div class="hero-num"><b>' + done + '</b><span>/' + total + '</span><em>已打分</em></div>' +
      '</div>' +
      '<div class="hero-bar"><i style="width:' + (total ? done / total * 100 : 0) + '%"></i></div>';
    main.appendChild(hero);

    if (!cands.length) {
      main.appendChild(el('div', 'card empty',
        '还没有面试者名单<br><span style="font-size:13px">回到首页，点「面试者名单」添加或批量导入</span>'));
    } else if (!usable.length) {
      main.appendChild(el('div', 'card empty',
        '名单里的面试者都已由其他组评分<br><span style="font-size:13px">可去「排名」页查看各组结果</span>'));
    } else {
      var list = el('div', 'list');
      cands.forEach(function (c, i) {
        var s = MY[c.id];
        var t = (s && Object.keys(s).length) ? dimTotal(s) : null;
        var lk = lockedOf(c);
        var lkName = lk ? (groupById(lk) || {}).name || '其他组' : '';
        var row = el('button', 'cand' + (lk ? ' lock' : (s ? ' done' : '')));
        var cm = c.comment;
        row.innerHTML = '<span class="idx">' + (i + 1) + '</span>' +
          '<span class="cand-main"><span class="cand-name">' + esc(c.name) +
          (c.cls ? '<em class="c-cls">' + esc(c.cls) + '</em>' : '') + '</span>' +
          (cm ? '<span class="cand-cmt">评语：' + esc(cm.text.length > 14 ? cm.text.slice(0, 14) + '…' : cm.text) + ' · ' + esc(cm.by) + '</span>' : '') +
          '</span>' +
          (lk ? '<span class="cand-tag empty">' + esc(lkName) + '已评</span>'
             : s ? '<span class="cand-tag">' + t + ' 分</span>'
                : '<span class="cand-tag empty">未打分</span>');
        row.onclick = function () {
          if (lk) { toast('「' + c.name + '」已由' + lkName + '评分，本组不能再评'); return; }
          openSheet(c);
        };
        list.appendChild(row);
      });
      main.appendChild(list);
    }

    $('#switchIv').onclick = function () {
      ME = null; MY = {}; MYG = null;
      try { localStorage.removeItem(LS_KEY); } catch (e) {}
      render();
    };
  }

  /* ================= 打分面板 ================= */
  function gradeBlock(title, dim, levels, cur) {
    var h = '<div class="grade-block"><div class="grade-label">' + esc(title) + '</div><div class="grade-row">';
    levels.forEach(function (lv, i) {
      h += '<button class="grade' + (cur === lv.key ? ' on' : '') + '" data-i="' + i +
        '" data-dim="' + dim + '" data-key="' + esc(lv.key) + '">' + esc(lv.label) + '<span>' + lv.score + '</span></button>';
    });
    return h + '</div></div>';
  }

  function openSheet(c) {
    var prev = MY[c.id] || {};
    var pend = {};
    CFG.dimensions.forEach(function (dm) { pend[dm.id] = prev[dm.id] || null; });
    var origCm = c.comment ? c.comment.text : '';
    var rd = curRound();

    var blocks = '';
    CFG.dimensions.forEach(function (dm) { blocks += gradeBlock(dm.name, dm.id, dm.levels, pend[dm.id]); });

    var sheet = $('#sheet');
    sheet.innerHTML = '<div class="sheet-grab"></div>' +
      '<div class="sheet-head"><div><div class="sheet-name">' + esc(c.name) + '</div>' +
      '<div class="sheet-sub">' + (rd ? esc(rd.name) + ' · ' : '') + (c.cls ? esc(c.cls) + ' · ' : '') + '打分人：' + esc(ME.interviewer) + '</div></div>' +
      '<button class="sheet-close" id="sheetClose">关闭</button></div>' +
      blocks +
      '<div class="grade-block"><div class="grade-label">评语</div>' +
        '<textarea id="cmBox" class="cm-box" maxlength="200" placeholder="写下对这位面试者的评语（可以打分时写，打分后再来改）">' +
        esc(origCm) + '</textarea>' +
        (c.comment ? '<div class="cm-meta">当前评语由 ' + esc(c.comment.by) + ' 填写 · ' + tsStr(c.comment.ts) + '</div>' : '') +
      '</div>' +
      '<div class="total-line"><span>本次合计</span><b id="totalNum">—</b></div>' +
      '<button class="btn-primary" id="saveBtn" disabled>保存</button>';

    showSheet('#sheet');
    var cmBox = $('#cmBox');

    function gradeOk() {
      return CFG.dimensions.length > 0 && CFG.dimensions.every(function (dm) { return !!pend[dm.id]; });
    }
    function gradeSum() {
      var sum = 0;
      CFG.dimensions.forEach(function (dm) { if (pend[dm.id]) sum += dimScore(dm.id, pend[dm.id]); });
      return sum;
    }

    function refresh() {
      var ok = gradeOk();
      var cmOk = cmBox.value.trim() !== origCm;   // 评语有改动才允许「只存评语」
      $('#totalNum').textContent = ok ? (gradeSum() + ' 分') : '—';
      $('#saveBtn').disabled = !(ok || cmOk);
    }

    sheet.querySelectorAll('.grade').forEach(function (btn) {
      btn.onclick = function () {
        vib();
        var dim = btn.getAttribute('data-dim');
        pend[dim] = btn.getAttribute('data-key');
        sheet.querySelectorAll('.grade[data-dim="' + dim + '"]').forEach(function (b) { b.classList.remove('on'); });
        btn.classList.add('on');
        refresh();
      };
    });

    $('#sheetClose').onclick = hideSheets;
    $('#saveBtn').onclick = function () {
      $('#saveBtn').disabled = true;
      var cmText = cmBox.value.trim();
      var hasGrade = gradeOk();
      var dims = {};
      CFG.dimensions.forEach(function (dm) { if (pend[dm.id]) dims[dm.id] = pend[dm.id]; });
      var jobs = [];
      if (cmText !== origCm) jobs.push(post('/api/comment', { c: c.id, text: cmText, by: ME.interviewer }));
      if (hasGrade) jobs.push(post('/api/score', { r: rd ? rd.id : '', g: CURGROUP, c: c.id, i: ME.interviewer, dims: dims }));
      Promise.all(jobs).then(function (res) {
        var ci = 0;
        if (cmText !== origCm) {
          var jc = res[ci++];
          if (jc && jc.candidate) {
            CFG.candidates = CFG.candidates.map(function (x) { return x.id === jc.candidate.id ? jc.candidate : x; });
          }
        }
        if (hasGrade) {
          MY[c.id] = dims;
          LOCK[c.id] = CURGROUP;
        }
        vib(20); hideSheets(); render();
        toast(hasGrade ? '已保存' : '评语已保存');
        if (hasGrade) {
          setTimeout(function () {
            var cands = CFG.candidates;
            var idx = 0;
            cands.forEach(function (cc, i) { if (cc.id === c.id) idx = i; });
            for (var k = 1; k <= cands.length; k++) {
              var nx = cands[(idx + k) % cands.length];
              if (LOCK[nx.id] && LOCK[nx.id] !== CURGROUP) continue;
              if (!MY[nx.id] || !Object.keys(MY[nx.id]).length) { openSheet(nx); return; }
            }
            toast('本组已全部打分完成');
          }, 300);
        }
      }).catch(function (e) { $('#saveBtn').disabled = false; toast('保存失败：' + e.message); });
    };

    refresh();
  }

  /* ================= 面试者名单（首页入口，所有组共用） ================= */
  function openCands() {
    paintCands();
    showSheet('#asheet');
  }

  function paintCands() {
    var sheet = $('#asheet');
    sheet.innerHTML = '<div class="sheet-grab"></div>' +
      '<div class="sheet-head"><div><div class="sheet-name">面试者名单</div>' +
      '<div class="sheet-sub">所有小组共用 · 按班级 + 姓名添加，支持批量导入</div></div>' +
      '<button class="sheet-close" id="aClose">完成</button></div>' +
      '<div class="m-sec"><div class="grade-label">单个添加</div>' +
        '<div class="add-row"><input class="c-cls" id="cCls" maxlength="30" placeholder="班级，如 软件2301">' +
        '<input id="cName" maxlength="20" placeholder="姓名"><button id="cAdd">添加</button></div></div>' +
      '<div class="m-sec batch-box"><div class="grade-label">批量导入</div>' +
        '<textarea id="cBatch" placeholder="每行一位：班级 姓名（空格分隔）&#10;例如：&#10;软件2301 张三&#10;大数据2302 李四&#10;也可以只写姓名"></textarea>' +
        '<button class="btn-batch" id="cBatchBtn">批量导入</button></div>' +
      '<div class="m-sec"><div class="grade-label">已添加 ' + CFG.candidates.length + ' 人（点 × 删除）</div>' +
        '<div class="chip-wrap" id="cList"></div></div>';

    $('#aClose').onclick = hideSheets;

    var box = $('#cList');
    if (!CFG.candidates.length) {
      box.innerHTML = '<span style="color:#98a2b3;font-size:13.5px">还没有添加</span>';
    } else {
      CFG.candidates.forEach(function (c) {
        var label = (c.cls ? c.cls + ' ' : '') + c.name;
        var t = el('span', 'tag', esc(label) + '<i>×</i>');
        t.querySelector('i').onclick = function () {
          if (!confirm('把「' + label + '」从名单移除？\n所有组里他/她的打分记录也会一并删除。')) return;
          cdManage('del', { id: c.id }).then(function () { paintCands(); });
        };
        box.appendChild(t);
      });
    }

    var clsInp = $('#cCls'), nameInp = $('#cName');
    function add() {
      var v = nameInp.value.trim();
      if (!v) { toast('请输入姓名'); return; }
      cdManage('add', { name: v, cls: clsInp.value.trim() })
        .then(function () { nameInp.value = ''; nameInp.focus(); paintCands(); })
        .catch(function () {});
    }
    $('#cAdd').onclick = add;
    nameInp.onkeydown = function (e) { if (e.key === 'Enter') add(); };

    $('#cBatchBtn').onclick = function () {
      var items = [];
      $('#cBatch').value.split(/\n+/).forEach(function (line) {
        var t = line.trim().split(/\s+/);
        if (!t[0]) return;
        if (t.length >= 2) items.push({ cls: t[0], name: t.slice(1).join('') });
        else items.push({ cls: '', name: t[0] });
      });
      if (!items.length) { toast('请先粘贴名单，每行一位'); return; }
      cdManage('batch', { items: items })
        .then(function (j) {
          $('#cBatch').value = '';
          toast('已导入 ' + j.added + ' 人' + (j.skipped ? '，跳过 ' + j.skipped + ' 人（已存在或姓名无效）' : ''));
          paintCands();
        })
        .catch(function () {});
    };
  }

  function cdManage(op, payload) {
    var body = { kind: 'cd', op: op };
    Object.keys(payload).forEach(function (k) { body[k] = payload[k]; });
    return post('/api/manage', body).then(function (j) {
      CFG.candidates = j.candidates;
      vib(18);
      if (op === 'del') toast('已移除');
      if (VIEW === 'rank') renderRank(); else render();
      return j;
    }).catch(function (e) { toast(e.message); throw e; });
  }

  /* ================= 排名页（一轮内所有组分数合并的统一排名；轮次在打分页切换） ================= */
  function renderRank() {
    var main = $('#main'); main.innerHTML = '';
    $('#backBtn').hidden = true;
    $('#topTitle').textContent = '平均分排名';
    var rd = curRound();
    $('#topSub').textContent = (rd ? rd.name + ' · ' : '') + '全部组统一排名（轮次在打分页切换）';
    main.appendChild(el('div', 'card hint', '加载中…'));

    api('/api/rank?r=' + encodeURIComponent(rd ? rd.id : '')).then(function (j) {
      RANK = j.rows || [];
      paintRank();
    }).catch(function (e) {
      main.innerHTML = '';
      main.appendChild(el('div', 'card hint warn', '加载失败：' + esc(e.message)));
    });
  }

  function paintRank() {
    var main = $('#main'); main.innerHTML = '';

    if (!RANK.length) {
      main.appendChild(el('div', 'card empty', '还没有面试者名单<br><span style="font-size:13px">到首页「面试者名单」里添加</span>'));
      return;
    }
    var rd = curRound();
    var any = false;
    RANK.forEach(function (r) { if (r.count > 0) any = true; });
    if (!any) { main.appendChild(el('div', 'card empty', (rd ? rd.name : '') + '还没有人打分')); return; }

    RANK.forEach(function (r) {
      if (r.count === 0) {
        var e2 = el('div', 'rank-row');
        e2.innerHTML = '<div class="medal">—</div><div class="rank-main">' +
          '<div class="rank-name">' + esc(r.name) + (r.cls ? '<em class="c-cls">' + esc(r.cls) + '</em>' : '') + '</div>' +
          '<div class="rank-sub">还没有面试官打分</div></div>';
        main.appendChild(e2);
        return;
      }
      var cls = r.rank === 1 ? ' m1' : r.rank === 2 ? ' m2' : r.rank === 3 ? ' m3' : '';
      var sub = (r.total != null ? r.count + '/' + r.total : r.count + '') + ' 位面试官已打分 · 点击看明细';
      var row = el('button', 'rank-row');
      row.innerHTML = '<div class="medal' + cls + '">' + r.rank + '</div>' +
        '<div class="rank-main"><div class="rank-name">' + esc(r.name) +
        (r.cls ? '<em class="c-cls">' + esc(r.cls) + '</em>' : '') + '</div>' +
        '<div class="rank-sub">' + sub + '</div></div>' +
        '<div class="rank-score"><b>' + r.avg + '</b><span>平均分</span></div>';

      var detail = el('div', 'rank-detail');
      detail.hidden = true;
      var cmHtml = r.comment
        ? '<div class="rank-comment">评语：' + esc(r.comment.text) + '　<b>—— ' + esc(r.comment.by) + '</b></div>'
        : '';
      detail.innerHTML = cmHtml + r.detail.map(function (d) {
        var parts = (d.items || []).map(function (it) {
          return esc(it.name) + ' ' + esc(it.label) + ' ' + it.score;
        }).join(' + ');
        return '<div class="d-row"><span>' + esc(d.interviewer) + (parts ? '　' + parts : '') + '</span><b>' + d.total + '</b></div>';
      }).join('');
      row.onclick = function () { detail.hidden = !detail.hidden; };

      main.appendChild(row);
      main.appendChild(detail);
    });
  }

  /* ================= 管理（面试官 / 打分项 / 轮次，全局共用）：底部导航第三个 tab，整页渲染 ================= */
  function renderManage() {
    var main = $('#main'); main.innerHTML = '';
    $('#backBtn').hidden = true;
    $('#topTitle').textContent = '管理';
    $('#topSub').textContent = '面试官 · 打分项 · 小组 · 轮次，增删即时生效';

    /* --- 面试官 --- */
    var cIv = el('div', 'card');
    cIv.innerHTML =
      '<div class="card-title">面试官（点 × 移除）</div>' +
      '<div class="add-row"><input id="mIv" maxlength="20" placeholder="输入面试官姓名"><button id="mIvAdd">添加</button></div>' +
      '<div class="chip-wrap" id="mIvList"></div>';
    main.appendChild(cIv);
    var box = $('#mIvList');
    if (!CFG.interviewers.length) {
      box.innerHTML = '<span style="color:#98a2b3;font-size:13.5px">还没有添加</span>';
    } else {
      CFG.interviewers.forEach(function (n) {
        var t = el('span', 'tag', esc(n) + '<i>×</i>');
        t.querySelector('i').onclick = function () {
          if (!confirm('把「' + n + '」移除？\n他/她在所有组里的打分记录也会一并删除。')) return;
          manage('iv', n, 'del');
        };
        box.appendChild(t);
      });
    }
    var ivInp = $('#mIv');
    function addIv() {
      var v = ivInp.value.trim();
      if (!v) return;
      manage('iv', v, 'add').then(function () { ivInp.value = ''; ivInp.focus(); });
    }
    $('#mIvAdd').onclick = addIv;
    ivInp.onkeydown = function (e) { if (e.key === 'Enter') addIv(); };

    /* --- 打分项 --- */
    var cDim = el('div', 'card');
    cDim.innerHTML =
      '<div class="card-title">打分项（点 × 删除，该项在所有打分里的分数一并移除）</div>' +
      '<div class="add-row"><input id="dName" maxlength="10" placeholder="名称，如 项目经验"><button id="dAdd">添加</button></div>' +
      '<textarea id="dLv" class="lv-text" placeholder="每行一个等级：等级名 分值（空格分隔）&#10;例如：&#10;偏弱 60&#10;良好 75&#10;优秀 90"></textarea>' +
      '<div class="chip-wrap dim-list" id="dList"></div>';
    main.appendChild(cDim);
    var dbox = $('#dList');
    var dims = CFG.dimensions || [];
    if (!dims.length) {
      dbox.innerHTML = '<span style="color:#98a2b3;font-size:13.5px">还没有打分项</span>';
    } else {
      dims.forEach(function (dm) {
        var canDel = dims.length > 1;
        var lvTxt = dm.levels.map(function (lv) { return esc(lv.label) + lv.score; }).join(' / ');
        var t = el('span', 'tag', esc(dm.name) + '（' + lvTxt + '）' + (canDel ? '<i>×</i>' : ''));
        if (canDel) t.querySelector('i').onclick = function () {
          if (!confirm('删除「' + dm.name + '」？\n它在所有打分记录里的分数会一并移除。')) return;
          dimManage('del', { id: dm.id });
        };
        dbox.appendChild(t);
      });
    }
    function addDim() {
      var name = $('#dName').value.trim();
      var lv = [];
      var bad = null;
      $('#dLv').value.split(/\n+/).forEach(function (line) {
        var t = line.trim().split(/\s+/);
        if (!t[0]) return;
        var sc = Number(t[1]);
        if (t.length < 2 || !isFinite(sc) || sc < 0 || sc > 999) { bad = line.trim(); return; }
        lv.push({ label: t[0], score: sc });
      });
      if (bad) { toast('「' + bad + '」格式不对，应为：等级名 分值'); return; }
      if (!lv.length) { toast('请至少写一个等级：等级名 分值'); return; }
      dimManage('add', { name: name, levels: lv });
    }
    $('#dAdd').onclick = addDim;
    $('#dName').onkeydown = function (e) { if (e.key === 'Enter') addDim(); };

    /* --- 小组 --- */
    var cGp = el('div', 'card');
    cGp.innerHTML =
      '<div class="card-title">面试小组（分场面试用；点 × 删除，该组所有轮次里的分数一并移除）</div>' +
      '<div class="add-row"><input id="gpName" maxlength="10" placeholder="组名，如 第5组（留空自动编号）"><button id="gpAdd">添加</button></div>' +
      '<div class="chip-wrap" id="gpList"></div>';
    main.appendChild(cGp);
    var gbox = $('#gpList');
    var gps = CFG.groups || [];
    if (!gps.length) {
      gbox.innerHTML = '<span style="color:#98a2b3;font-size:13.5px">还没有小组</span>';
    } else {
      gps.forEach(function (gp) {
        var canDel = gps.length > 1;
        var t = el('span', 'tag', esc(gp.name) + (canDel ? '<i>×</i>' : ''));
        if (canDel) t.querySelector('i').onclick = function () {
          if (!confirm('删除「' + gp.name + '」？\n该组所有轮次里的打分记录会一并移除。')) return;
          gpManage('del', { id: gp.id });
        };
        gbox.appendChild(t);
      });
    }
    function addGp() {
      var inp = $('#gpName');
      var v = inp.value.trim();
      gpManage('add', { name: v });
    }
    $('#gpAdd').onclick = addGp;
    $('#gpName').onkeydown = function (e) { if (e.key === 'Enter') addGp(); };

    /* --- 轮次 --- */
    var cRd = el('div', 'card');
    cRd.innerHTML =
      '<div class="card-title">面试轮次（各轮共用同一套小组与面试官，分数按轮分开统计；点 × 删除该轮全部分数）</div>' +
      '<div class="add-row"><input id="mRd" maxlength="10" placeholder="轮次名，如 第3轮（留空自动编号）"><button id="mRdAdd">添加</button></div>' +
      '<div class="chip-wrap" id="mRdList"></div>';
    main.appendChild(cRd);
    var rbox = $('#mRdList');
    var rdList = CFG.rounds || [];
    if (!rdList.length) {
      rbox.innerHTML = '<span style="color:#98a2b3;font-size:13.5px">还没有轮次</span>';
    } else {
      rdList.forEach(function (rd) {
        var canDel = rdList.length > 1;
        var t = el('span', 'tag', esc(rd.name) + (canDel ? '<i>×</i>' : ''));
        if (canDel) t.querySelector('i').onclick = function () {
          if (!confirm('删除「' + rd.name + '」？\n该轮所有打分记录会一并删除。')) return;
          rdManage('del', { id: rd.id });
        };
        rbox.appendChild(t);
      });
    }
    function addRd() {
      var inp = $('#mRd');
      var v = inp.value.trim();
      rdManage('add', { name: v });
    }
    $('#mRdAdd').onclick = addRd;
    $('#mRd').onkeydown = function (e) { if (e.key === 'Enter') addRd(); };
  }

  function manage(kind, name, op) {
    return post('/api/manage', { kind: kind, name: name, op: op })
      .then(function (j) {
        if (j.interviewers) CFG.interviewers = j.interviewers;
        if (j.groups) CFG.groups = j.groups;
        vib(18);
        toast(op === 'add' ? '已添加' : '已移除');
        if (ME && CFG.interviewers.indexOf(ME.interviewer) < 0) {
          ME = null; MY = {}; MYG = null;
          try { localStorage.removeItem(LS_KEY); } catch (e) {}
        }
      if (VIEW === 'rank') renderRank(); else render();
    })
      .catch(function (e) { toast(e.message); throw e; });
  }

  /* 小组管理（分场面试用；删组会清掉该组所有轮次的分数） */
  function gpManage(op, payload) {
    var body = { kind: 'gp', op: op };
    Object.keys(payload).forEach(function (k) { body[k] = payload[k]; });
    return post('/api/manage', body).then(function (j) {
      CFG.groups = j.groups;
      vib(18);
      toast(op === 'add' ? '小组已添加' : '小组已删除');
      if (op === 'del' && CURGROUP && !groupById(CURGROUP)) {
        // 当前所在的组被删了，回首页
        CURGROUP = null; MY = {}; MYG = null;
      }
      if (VIEW === 'rank') renderRank();
      else if (VIEW === 'manage') renderManage();
      else render();
      return j;
    })
      .catch(function (e) { toast(e.message); throw e; });
  }

  /* 轮次管理（各轮共用同一套小组与面试官，分数按轮分开） */
  function rdManage(op, payload) {
    var body = { kind: 'rd', op: op };
    Object.keys(payload).forEach(function (k) { body[k] = payload[k]; });
    return post('/api/manage', body).then(function (j) {
      CFG.rounds = j.rounds;
      vib(18);
      toast(op === 'add' ? '轮次已添加' : '轮次已删除');
      if (!roundById(CURROUND)) {   // 当前轮次被删了，切到第一轮
        CURROUND = firstRound() ? firstRound().id : null;
        MY = {}; MYG = null;
      }
      if (VIEW === 'rank') renderRank(); else render();
      return j;
    })
      .catch(function (e) { toast(e.message); throw e; });
  }

  /* 打分项管理（动态维度：每项若干等级，打分记录按项存等级） */
  function dimManage(op, payload) {
    var body = { kind: 'dim', op: op };
    Object.keys(payload).forEach(function (k) { body[k] = payload[k]; });
    return post('/api/manage', body).then(function (j) {
      CFG.dimensions = j.dimensions;
      vib(18);
      toast(op === 'add' ? '打分项已添加' : '打分项已删除');
      MY = {}; MYG = null;   // 重新拉自己的分，清掉已删项的残留 key
      if (VIEW === 'rank') renderRank(); else render();
      return j;
    })
      .catch(function (e) { toast(e.message); throw e; });
  }

  /* ================= 弹层控制 ================= */
  function showSheet(sel) {
    hideSheets(true);
    $('#mask').hidden = false;
    var s = $(sel);
    s.hidden = false;
    requestAnimationFrame(function () { s.classList.add('show'); });
  }
  function hideSheets(keepMask) {
    ['#sheet', '#asheet'].forEach(function (sel) {
      var s = $(sel);
      s.classList.remove('show');
      if (!s.hidden) setTimeout(function () { s.hidden = true; s.innerHTML = ''; }, 280);
    });
    if (!keepMask) $('#mask').hidden = true;
  }
  $('#mask').onclick = function () { hideSheets(); };

  /* ================= 交互 ================= */
  $('#navScore').onclick = function () { VIEW = 'score'; hideSheets(); render(); };
  $('#navRank').onclick = function () { VIEW = 'rank'; hideSheets(); render(); };
  $('#navManage').onclick = function () { VIEW = 'manage'; hideSheets(); render(); };
  $('#backBtn').onclick = function () { CURGROUP = null; hideSheets(); render(); };

  boot();
})();
</script>
</body>
</html>
