  /* 配置某一轮考察哪些打分项：从现有打分项里勾选，也可以就地新建一个并自动勾到本轮 */
  function openRoundDims(id) {
    var sheet = $('#dsheet');
    var inPlace = !sheet.hidden;   // 从打分项表单切回来时别重播入场动画
    function paint() {
      var rd = roundById(id);
      if (!rd) { hideSheets(); return; }
      var cur = roundDims(id).map(function (d) { return d.id; });
      var rows = (CFG.dimensions || []).map(function (d) {
        var on = cur.indexOf(d.id) >= 0;
        return '<button class="pick-row' + (on ? ' on' : '') + '" data-id="' + esc(d.id) + '">' +
          '<span class="pk-box">✓</span>' +
          '<span class="pick-main"><span class="pick-name">' + esc(d.name) +
            (dimIsFree(d) ? '<span class="dim-mode">自由填分</span>' : '') + '</span>' +
          '<span class="pick-meta">' + esc(dimBrief(d)) + '</span></span></button>';
      }).join('');
      if (!rows) rows = '<div class="empty">还没有打分项<br>点下面的「＋ 新建打分项」建一个</div>';
      var empty = !cur.length;

      sheet.className = 'sheet stack' + (sheet.classList.contains('show') ? ' show' : '');
      sheet.innerHTML = '<div class="sheet-grab"></div>' +
        '<div class="sheet-head"><div><div class="sheet-name">' + esc(rd.name) + ' · 考察的打分项</div>' +
        '<div class="sheet-sub">自己勾选这一轮要考察的项，改完立即生效</div></div>' +
        '<button class="sheet-close" id="rdClose">关闭</button></div>' +
        '<div class="sheet-body">' + rows +
          '<button class="lv-add" id="rdNewDim">＋ 新建打分项（建好自动勾到本轮）</button>' +
          '<div class="hint" style="margin-top:10px"><span style="font-size:12.5px;color:#98a2b3">' +
          '勾选完全由你决定：在别处新建的打分项不会自动进来，取消勾选后该项的分数也不再计入本轮的合计与排名' +
          '（历史记录还在，重新勾上就恢复）。可以一个都不选，但那样这一轮打不了分。</span></div>' +
        '</div>' +
        '<div class="sheet-foot"><div class="total-line' + (empty ? ' warn' : '') + '">' +
          (empty
            ? '<span style="color:#b54708;font-weight:600">还没勾选任何打分项 · 这一轮打不了分</span><b>0 项</b>'
            : '<span>本轮考察 ' + cur.length + ' 项 · 满分</span><b>' + dimsMax(id) + ' 分</b>') +
        '</div></div>';

      $('#rdClose').onclick = hideSheets;
      sheet.querySelectorAll('.pick-row').forEach(function (b) {
        b.onclick = function () {
          var did = b.getAttribute('data-id');
          var next = roundDims(id).map(function (d) { return d.id; });
          var i = next.indexOf(did);
          if (i >= 0) next.splice(i, 1);      // 自由取消，允许清空
          else next.push(did);
          vib();
          rdSetDims(id, next).then(function () { if (!$('#dsheet').hidden) paint(); });
        };
      });

      /* 就地新建：建好后自动勾到本轮（是在「配置本轮考察项」里主动建的，意图明确） */
      $('#rdNewDim').onclick = function () {
        vib();
        openDimForm({
          title: '新建打分项',
          sub: '建好后会自动勾选到「' + rd.name + '」',
          saveText: '保存并勾到本轮',
          name: '',
          rows: [
            { key: '', label: '', score: '', ph: ['如 偏弱', '60'] },
            { key: '', label: '', score: '', ph: ['如 良好', '75'] },
            { key: '', label: '', score: '', ph: ['如 优秀', '90'] }
          ],
          onCancel: function () { openRoundDims(id); },     // 取消就回到本轮配置
          afterSave: function () { openRoundDims(id); },    // 保存后回来，能看到新项已勾上
          onSave: function (p) {
            return dimManage('add', { name: p.name, mode: p.mode, max: p.max, levels: p.levels }).then(function () {
              var created = (CFG.dimensions || []).filter(function (d) { return d.name === p.name; }).pop();
              if (!created) return null;
              var next = roundDims(id).map(function (d) { return d.id; });
              if (next.indexOf(created.id) < 0) next.push(created.id);
              return rdSetDims(id, next);
            });
          }
        });
      };
    }
    if (inPlace) paint();
    else { hideSheets(); paint(); showSheet('#dsheet'); }
  }

  /* 保存某一轮的考察范围（点一下即生效） */
  function rdSetDims(id, dimIds) {
    return post('/api/manage', { kind: 'rd', op: 'dims', id: id, dims: dimIds })
      .then(function (j) {
        CFG.rounds = j.rounds;
        vib(18);
        MY = {}; MYG = null;   // 本轮考察范围变了，重新拉自己的分数
        if (VIEW === 'rank') renderRank();
        else if (VIEW === 'manage') renderManage();
        else render();
        return j;
      })
      .catch(function (e) { toast(e.message); throw e; });
  }

  function manage(kind, name, op) {
    return post('/api/manage', { kind: kind, name: name, op: op })
      .then(function (j) {
        if (j.interviewers) CFG.interviewers = j.interviewers;
        if (j.groups) CFG.groups = j.groups;
        vib(18);
        toast(op === 'add' ? '已添加' : '已移除');
        if (ME && CFG.interviewers.indexOf(ME.interviewer) < 0) {
          ME = null; MY = {}; MYG = null;
          try { localStorage.removeItem(LS_KEY); } catch (e) {}
        }
      if (VIEW === 'rank') renderRank(); else render();
    })
      .catch(function (e) { toast(e.message); throw e; });
  }

  /* 小组管理（增删小组；iv-add / iv-del 配置小组的面试官） */
  function gpManage(op, payload) {
    var body = { kind: 'gp', op: op };
    Object.keys(payload).forEach(function (k) { body[k] = payload[k]; });
    return post('/api/manage', body).then(function (j) {
      CFG.groups = j.groups;
      vib(18);
      if (op === 'add') toast('小组已添加');
      else if (op === 'del') toast('小组已删除');
      else if (op === 'iv-add') toast('已加入该组');
      else if (op === 'iv-del') toast('已移出该组');
      if (op === 'del' && CURGROUP && !groupById(CURGROUP)) {
        // 当前所在的组被删了，回首页
        CURGROUP = null; MY = {}; MYG = null;
      }
      if (VIEW === 'rank') renderRank();
      else if (VIEW === 'manage') renderManage();
      else render();
      return j;
    })
      .catch(function (e) { toast(e.message); throw e; });
  }

  /* 打分项等级编辑器见上方 openDimForm（新建 / 编辑共用） */

  /* 轮次管理（各轮共用同一套小组与面试官，分数按轮分开） */
  function rdManage(op, payload) {
    var body = { kind: 'rd', op: op };
    Object.keys(payload).forEach(function (k) { body[k] = payload[k]; });
    return post('/api/manage', body).then(function (j) {
      CFG.rounds = j.rounds;
      vib(18);
      toast(op === 'add' ? '轮次已添加' : '轮次已删除');
      if (!roundById(CURROUND)) {   // 当前轮次被删了，切到第一轮
        CURROUND = firstRound() ? firstRound().id : null;
        MY = {}; MYG = null;
      }
      if (VIEW === 'rank') renderRank(); else render();
      return j;
    })
      .catch(function (e) { toast(e.message); throw e; });
  }

  /* 打分项管理（动态维度：每项若干等级，打分记录按项存等级） */
  function dimManage(op, payload) {
    var body = { kind: 'dim', op: op };
    Object.keys(payload).forEach(function (k) { body[k] = payload[k]; });
    return post('/api/manage', body).then(function (j) {
      CFG.dimensions = j.dimensions;
      if (j.rounds) CFG.rounds = j.rounds;   // 删打分项会级联影响各轮的考察范围
      vib(18);
      toast(op === 'add' ? '打分项已添加' : op === 'edit' ? '打分项已更新' : '打分项已删除');
      MY = {}; MYG = null;   // 重新拉自己的分，清掉已删项的残留 key
      if (VIEW === 'rank') renderRank(); else render();
      return j;
    })
      .catch(function (e) { toast(e.message); throw e; });
  }

  /* ================= 弹层控制 ================= */
  function showSheet(sel) {
    hideSheets(true);
    $('#mask').hidden = false;
    var s = $(sel);
    clearTimeout(s._hideT);
    s.hidden = false;
    requestAnimationFrame(function () { s.classList.add('show'); });
  }
  function hideSheets(keepMask) {
    ['#sheet', '#asheet', '#dsheet', '#csheet'].forEach(function (sel) {
      var s = $(sel);
      clearTimeout(s._hideT);
      s.classList.remove('show');
      if (!s.hidden) s._hideT = setTimeout(function () { s.hidden = true; s.innerHTML = ''; s.className = 'sheet'; }, 280);
    });
    if (!keepMask) $('#mask').hidden = true;
  }
  function anySheetOpen() {
    return ['#sheet', '#asheet', '#dsheet'].some(function (sel) {
      var s = $(sel);
      return s && !s.hidden;
    });
  }

  /* 应用内二次确认，返回 Promise<boolean>
     不用原生 confirm：Chrome 在弹过几次后会给出「阻止此页面创建更多对话框」，
     一旦被勾选，confirm() 会直接返回 false 且不显示对话框 —— 表现就是「点了没反应」。
     cfg = { title, name?, lines?:[], okText?, cancelText?, danger? } */
  function askConfirm(cfg) {
    return new Promise(function (resolve) {
      var sheet = $('#csheet');
      var lines = (cfg.lines || []).map(function (t) { return '<div>' + esc(t) + '</div>'; }).join('');
      sheet.className = 'sheet stack';
      sheet.innerHTML =
        '<div class="sheet-grab"></div>' +
        '<div class="sheet-head"><div><div class="sheet-name">' + esc(cfg.title || '请确认') + '</div></div></div>' +
        '<div class="sheet-body"><div class="confirm-body">' +
          (cfg.name ? '<div class="confirm-target">' + esc(cfg.name) + '</div>' : '') +
          (lines ? '<div class="confirm-lines">' + lines + '</div>' : '') +
        '</div></div>' +
        '<div class="sheet-foot row">' +
          '<button class="b-cancel" id="cfNo">' + esc(cfg.cancelText || '取消') + '</button>' +
          '<button class="b-save' + (cfg.danger ? ' b-danger' : '') + '" id="cfYes">' + esc(cfg.okText || '确定') + '</button>' +
        '</div>';
      /* 只显示这一层，不关掉下面已经打开的弹窗（比如「新建打分项」表单） */
      clearTimeout(sheet._hideT);
      $('#mask').hidden = false;
      sheet.hidden = false;
      requestAnimationFrame(function () { sheet.classList.add('show'); });
      var settled = false;
      function done(v) {
        if (settled) return;
        settled = true;
        sheet.classList.remove('show');
        clearTimeout(sheet._hideT);
        sheet._hideT = setTimeout(function () { sheet.hidden = true; sheet.innerHTML = ''; sheet.className = 'sheet'; }, 280);
        if (!anySheetOpen()) $('#mask').hidden = true;
        resolve(v);
      }
      $('#cfNo').onclick = function () { done(false); };
      $('#cfYes').onclick = function () { done(true); };
    });
  }
  $('#mask').onclick = function () {
    var c = $('#csheet');
    if (c && !c.hidden) { var no = $('#cfNo'); if (no) { no.click(); return; } }
    hideSheets();
  };

  /* ================= 交互 ================= */
  $('#navScore').onclick = function () { VIEW = 'score'; hideSheets(); render(); };
  $('#navRank').onclick = function () { VIEW = 'rank'; RANK_ROUND = CURROUND; hideSheets(); render(); };
  $('#navManage').onclick = function () { VIEW = 'manage'; MANAGE_SEC = null; hideSheets(); render(); };
  $('#backBtn').onclick = function () {
    hideSheets();
    if (VIEW === 'manage' && MANAGE_SEC) { MANAGE_SEC = null; renderManage(); return; }
    CURGROUP = null;
    render();
  };

  boot();
})();
</script>
</body>
</html>
